# ============================================================
# 真实事故案例 YAML V1 —— 依据官方调查报告逐字提取（禁止编造）
# ============================================================
# 来源目录：agent1/煤矿资料收集/05_近五年煤矿顶板事故通报/
# 解析方式：本地并行 agent 读取报告原文（HTML 直读 / PDF 分页读），逐字段提取
# 提取原则：
#   - causes/precursors/actions/lessons 均依据报告原文改写，不增删事实
#   - precursors 为描述性前兆，报告中无量化数值时绝不编造能量/频次/b 值
#   - actions 已改写为"预警触发时应采取的处置"语义（面向事前处置）
#   - risk_level 映射：一般→yellow / 较大→orange / 重大→red / 涉险·未遂→blue
#   - risk_level_original 为报告原文等级表述，保留供审计溯源
# 状态：16 份完整解析（ok）；4 份非事故报告（见 非报告项说明.md）
# 与 tests/fixtures/accident_cases.yaml 的关系：该文件为仿真占位数据，
#   真实数据到位后，知识检索优先使用本文件案例（case_id 前缀 real- 区分）。
#
# case_id 命名：real-YYYY-NNN（YYYY=事故年份，NNN=该年份序号，按日期升序）
cases:
  - case_id: "real-2021-001"
    location: "新能矿业有限公司王家塔矿井，3-1煤南部东西胶运大巷掘进工作面（掘进至约2547米处）"
    occurred_at: "2021-01-09T21:40:00"
    risk_level: "yellow"
    risk_level_original: "一般事故"
    causes:
      - "直接原因：综掘二队生产班未按作业规程架设临时支护（前探梁未安设背板、未由外向内逐排施工），致顶板冒落；安监员违章进入已冒落区域被二次冒落矸石砸中致死"
      - "公司超能力下达产量和进尺指标、倒排工期抢进度，减少掘进支护工艺环节，对违规支护长期失察"
      - "现场安全管理不到位，对临时支护不可靠、锚杆施工顺序不按规定等习惯性违章行为失察"
      - "技术管理与安全培训不到位，遇地质条件变化未及时补充修改作业规程，员工自保互保意识差"
    precursors:
      - "直接顶为2.1米砂质泥岩、松散胶接、层理发育且夹煤线，顶板岩层松软破碎，掘进遇地质条件变化未及时修改作业规程"
      - "临时支护前探梁未安设背板、锚固剂药卷卡在锚杆孔内，支护与施工处于不完好状态"
      - "第一次顶板掉落矸石（约0.4米×0.5米×0.1米）砸伤人员后，仍有人员在临时支护不完好的顶板下休息并未撤离"
      - "已发生冒落区域周边未设警戒，安监员再次进入冒落区后发生约2米×1.2米×0.3米二次大冒落"
    actions:
      - "顶板首次出现掉矸、淋水等征兆时立即将人员撤离至永久支护下的安全位置，严禁在临时支护不完好的顶板下停留"
      - "冒落发生后在冒落区周边设警戒并停止该区域作业，严禁冒险进入已发生冒落区域，待支护加固、风险消除后再恢复作业"
      - "遇顶板松软破碎、层理发育等地质条件变化时，及时补充修改作业规程，严格执行短掘短支或采用掘锚一体先进支护工艺"
      - "严禁超能力、超进尺组织生产，合理调整采掘接续，杜绝倒排工期抢进度削减支护环节"
    outcome: "死亡1人（安监员王丕军）、受伤1人（班长洪秀华），直接经济损失300万元；报告未载明停产与恢复情况"
    lessons:
      - "企业必须落实安全生产主体责任，严禁超能力下达产量进尺指标、鼓励超能力超进尺作业"
      - "必须严格执行作业规程规定的支护顺序与工艺，坚决杜绝临时支护不设背板等习惯性违章"
      - "强化安全教育培训，提升员工自保互保意识与风险辨识能力，人员受伤后应及时撤到永久支护下"
      - "事故发生后须依法依规及时报告，杜绝迟报、瞒报"
    source: "内蒙古煤矿安全监察局鄂尔多斯监察分局组织的事故调查组（会同鄂尔多斯市能源局、伊金霍洛旗能源局、纪委监委、公安局、应急管理局、总工会等）；报告无落款文号"

  - case_id: "real-2022-001"
    location: "新汶矿业集团有限责任公司华丰煤矿，11105工作面上平巷掘进工作面迎头（-750m水平一采区，距15#导线点61.7m）"
    occurred_at: "2022-03-22T11:26:00"
    risk_level: "yellow"
    risk_level_original: "一般事故"
    causes:
      - "直接原因：迎头围岩破碎，当班未按过老巷补充措施在迎头左前上方采用超前锚杆或撞钎法打入长钢钎超前控制顶板，破碎岩石漏冒将2名作业人员埋住"
      - "区队现场管理不到位，未按规定自15#导线点前52.7m开始增设梯形棚加强支护，对应力集中、围岩破碎、梯形棚变形严重等问题未重视"
      - "安全风险辨识不到位，只辨识出老空水、有害气体2项风险，未辨识出应力集中、围岩破碎、顶板管理难度大等风险；断层致岩柱由11m减小到4.4m未进一步辨识"
      - "技术管理有缺陷，地质测量部下达过老巷通知书后矿建一部未及时补充加强支护措施，矿技术管理部门督促落实不力"
      - "安全监督检查不深入，检查发现的U型棚背顶、背帮不实等问题至事故发生未整改，集团检查表述缺乏针对性"
    precursors:
      - "3月13日早班迎头掘进至15#导线点前53.6m时巷道顶板破碎，3月14日发现原支护不可靠"
      - "加强支护段应力集中、围岩破碎，梯形棚变形严重且有1架棚梁被压断"
      - "3月22日夜班（事发前班）迎头右肩窝有少量淋水，并有少量破碎矸石掉落"
      - "迎头左前上方未采取超前控制顶板措施，右前上方仅临时打入4根φ108mm钢管（单根3m）"
    actions:
      - "遇断层、破碎带、过老巷等特殊情况时，必须先制定并落实补充安全技术措施，在迎头采用超前锚杆或撞钎法打入长钢钎超前控制顶板后，方可组织人员进入迎头作业"
      - "发现顶板破碎、淋水、破碎矸石掉落、棚梁变形受压等征兆时，立即停止作业、撤出人员，先补强加固支护再恢复作业"
      - "对已变形严重的梯形棚等加强支护，及时增设U型棚等补强措施并对背顶、背帮不实问题整改到位后再组织施工"
      - "组织作业前扎实开展风险辨识评估和安全确认，确认现场安全后方可指挥生产作业"
    outcome: "死亡2人（赵辉、段光林，段光林受伤后于4月25日医治无效死亡），直接经济损失298.98万元；报告未载明停产与恢复情况"
    lessons:
      - "强化区队管理，严格按作业规程和安全技术措施组织指挥生产，坚决杜绝违章指挥、违章作业"
      - "过老巷、过断层等特殊环节必须全面辨识应力集中、围岩破碎等安全风险，不能只识别水害、气体风险"
      - "地质条件变化时必须及时下达地质预报、编制补充安全技术措施并抓好现场落实"
      - "强化监督检查针对性，对检查发现的问题跟踪督导整改到位，杜绝层层把关、层层失守"
    source: "华丰煤矿\"3·22\"顶板事故调查组（由国家矿山安全监察局山东局组织泰安市应急管理局、能源局、公安局、总工会等成立），落款2022年7月16日；报告无文号"

  - case_id: "real-2022-002"
    location: "贵州省织金县兴荣矿业有限公司兴荣煤矿，11402运输巷掘进工作面迎头（一采区，K14煤层，已掘进68m）"
    occurred_at: "2022-06-30T06:40:00"
    risk_level: "yellow"
    risk_level_original: "报告未明示事故等级（事故类别和性质认定死亡1人）"
    causes:
      - "直接原因：11402运输巷掘进工作面遇断层地质构造，断层面影响范围内顶帮支护失效，锚杆机作业扰动引起顶板和巷帮垮落将工人掩埋"
      - "安全管理层层失守，工作面遇地质构造且未编制过断层安全技术措施的情况下，矿长及管理人员均未作出暂停掘进作业的决策"
      - "地质工作不严不实，未提前探测出掘进前方地质构造，揭露构造后未及时探明、未下达地质预报"
      - "未根据地质构造对支护进行选型和参数计算、未编制过断层安全技术措施采取有效加强支护"
      - "安全风险分级管控制度不落实，未建立防采掘工作面、巷道片帮事故的分级管控制度；新工人仅培训3天，自保互保意识差"
    precursors:
      - "6月28日八点班总工程师入井发现迎头煤层变薄，安排探测地质构造"
      - "6月29日早班综掘队长提出11402运输巷迎头出现地质构造，仅决定按以往经验施工锚索梁加强支护，未暂停掘进"
      - "事故当班支护过程因受断层影响存在轻微漏顶和片帮现象，支护作业断断续续"
      - "遇断层地质构造：断层面倾角约70°，落差1.5~2.0m，断层面影响范围内顶帮支护失效"
    actions:
      - "遇断层、地质构造时立即暂停掘进作业，先探明构造情况并下达地质预报，编制过断层安全技术措施（如注浆加固构造、针对性加强支护）并经审批后方可恢复作业"
      - "发现煤层变薄、轻微漏顶、片帮等异常征兆时，及时停止作业撤出人员，敲帮问顶、加强顶帮支护后再作业"
      - "建立防止采掘工作面、巷道片帮事故的安全风险分级管控制度，过构造、过老巷等环节由带班矿领导现场盯守"
      - "加强地质前探和预测预报，支护参数充分计算论证并测试锚固力、预紧力，确保支护强度满足要求"
    outcome: "死亡1人（江文海），直接经济损失290.1万元；报告未载明停产与恢复情况"
    lessons:
      - "遇地质构造必须编制过断层安全技术措施并采取有效加强支护，严禁未采取措施冒险掘进作业"
      - "加强地质前探和预测预报，超前探测掘进前方地质构造并及时下达地质预报"
      - "落实安全风险分级管控和隐患排查治理双重预防机制，建立健全防片帮等顶板管理制度"
      - "强化安全教育培训与应急演练，严格执行事故报告时限，杜绝迟报、瞒报"
    source: "贵州省织金县兴荣矿业有限公司兴荣煤矿\"6·30\"顶板事故调查组（国家矿山安全监察局贵州局牵头，会同织金县人民政府、能源局、应急管理局、公安局、总工会等），报告无文号"

  - case_id: "real-2022-003"
    location: "山东新陶阳矿业有限责任公司（新陶阳煤矿）8305综采工作面撤面通道内（8煤层，中三井田-350m水平8300采区西翼，工作面标高-502.0～-446.3m）"
    occurred_at: "2022-07-24T11:30:00"
    risk_level: "yellow"
    risk_level_original: "一般事故"
    causes:
      - "8煤层直接顶四灰局部发育\"二合顶\"，受采动影响易冒落，冒落大块矸石（1m×0.6m×0.4m，重约700kg）砸人致死。"
      - "新入职职工李全国在无人监护下独自回撤临时带帽单体液压支柱，未严格执行\"敲帮问顶\"制度，违章独立作业。"
      - "撤面通道支护措施护顶能力差（钢梁间距1.5m、综采支架前护板到煤壁最大1.8m），不能有效防止大块矸石冒落，未针对\"二合顶\"制定专项措施。"
      - "安全风险辨识管控不到位，未辨识出\"二合顶\"冒落风险；安全监督检查流于形式，师徒合同监护未落实。"
      - "安全教育培训不到位，职工自保互保意识差；驻矿督查员对瞒报事故失察。"
    precursors:
      - "8煤层直接顶四灰底部无规律分布透镜状、楔形、草帽形分层\"二合顶\"，受采动影响易冒落（事故区段顶板岩性固有弱面）"
      - "回撤临时带帽单体液压支柱时顶板突发\"哗啦\"声响，随后矸石冒落（顶板失稳前兆）"
      - "撤面通道施工区段钢梁间距1.5m、前护板距煤壁最大1.8m，护顶不充分（支护薄弱状态）"
    actions:
      - "回撤临时支护、进入机道作业前必须严格执行\"敲帮问顶\"，先处理悬矸危岩，严禁空顶作业。"
      - "对直接顶发育\"二合顶\"等易冒落构造的区段，优化支护设计并加密支护、提高护顶能力，防止大块矸石冒落。"
      - "加强顶板离层监测，严把支护质量验收关，对撤面通道等特殊工序安排专人重点盯守。"
      - "新工人入井作业严格落实师徒合同和监护职责，严禁单独作业、无人监护。"
    outcome: "造成1人死亡，直接经济损失200.2万元；事故后矿井及上级公司瞒报事故，善后事宜于2022年7月29日处理完毕，矿井被罚款300万元、上级公司被罚款200万元。"
    lessons:
      - "顶板局部\"二合顶\"构造受采动易冒落，撤面通道等特殊工序须针对顶板岩性制定专项支护措施并严格现场落实。"
      - "严禁新工人独立作业，师徒合同监护、跟班安全检查必须落实到位。"
      - "严格执行\"敲帮问顶\"和支护质量验收，严禁空顶作业，风险辨识要覆盖顶板构造特性。"
      - "事故必须及时如实上报，瞒报事故的矿井及主要负责人将受到行政撤职、重罚等严厉问责。"
    source: "新陶阳矿业有限责任公司\"7·24\"瞒报顶板事故调查组（国家矿山安全监察局山东局牵头组织，肥城市人民政府等参加，2022年10月9日）"

  - case_id: "real-2022-004"
    location: "山西长治沁源凤凰台煤业有限公司3#煤层31采区3102胶带顺槽掘进工作面（半煤岩巷，左右实体煤，上覆为2#煤层采空区，锚网梁索支护）"
    occurred_at: "2022-08-04T00:00:00"
    risk_level: "orange"
    risk_level_original: "较大（较大顶板事故）"
    causes:
      - "违反过断层安全技术措施\"掘一排、支一排\"规定，架棚支护已滞后迎头2.4米未补强即继续冒险掘进"
      - "迎头4.5米范围内仅有锚网梁索支护，不足以支撑顶板压力，顶板结构失衡发生冒顶"
      - "现场安全管理缺失：过断层期间未安排专职安全员监督，当班带班矿领导、驻矿安检员未到事故地点检查，班长违章指挥"
      - "施工技术管理缺位：未查清掘进面上覆2#煤层开采历史和老空巷道布置情况，未组织学习并执行过断层措施"
      - "日常安全管理混乱：入井检身不严、人员识别卡代打卡、特种作业人员冒名顶替、带班提前升井"
    precursors:
      - "过断层地段架棚补强支护滞后掘进迎头2.4米（按措施应\"掘一排支一排\"），仅靠锚网梁索支护支撑顶板"
      - "上覆为2#煤层采空区、顶板压力大，锚网梁索支护不足以支撑顶板压力"
    actions:
      - "过断层等特殊地段严格执行\"掘一排、支一排\"，架棚支护滞后即停止掘进并及时补强支护"
      - "发现支护强度不足或支护滞后时立即撤出作业人员，严禁在仅锚网梁索支护区域冒险掘进"
      - "安排专职安全员对过断层掘进现场全程安全监督，带班矿领导、驻矿安检员必须到关键地点检查"
      - "落实入井检身登记与人员识别卡管理，特种作业人员持证上岗，杜绝代打卡、冒名顶替"
    outcome: "造成5人遇难，直接经济损失1982.28万元；事故发生后煤矿迟报、谎报（停产与恢复情况报告未提及）"
    lessons:
      - "严禁违反过断层安全技术措施冒险掘进，支护滞后必须及时补强后再作业"
      - "强化现场安全管理，关键危险作业须专职安全员监督并安排带班矿领导下井检查"
      - "查清掘进面上覆采空区及老空巷道布置情况，完善施工技术管理与措施贯彻"
      - "落实建设、施工、监理三方安全责任及上级企业安全管理责任，杜绝失察放任"
    source: "国家矿山安全监察局事故调查和统计司（事故案例，无文号）"

  - case_id: "real-2022-005"
    location: "宣威市能拓矿业有限公司烂坝煤矿（云南省宣威市乐丰乡新月村委会境内）10303回采工作面反向炮掘运输巷维修作业点（沿C3煤层走向布置，直接顶为泥质粉砂岩厚4～8m）"
    occurred_at: "2022-10-26T05:52:00"
    risk_level: "yellow"
    risk_level_original: "一般事故"
    causes:
      - "事故地点顶板岩层节理发育、破碎且未按规定进行支护，岩层脱落被金属网兜住形成\"网兜\"。"
      - "作业人员在未采取临时支护措施的情况下站在\"网兜\"下方剪开金属网，网兜岩石连带顶板碎石一起冒落。"
      - "未按作业规程支护（事故时锚杆间距、排距为1.5m，规程规定0.8m，巷道边帮无支护），未按措施在距维修点5m处施工锚索加强支护。"
      - "现场安全管理不到位，带班矿领导、安全员发现违章冒险作业未制止，\"三违\"突出；6名作业人员未经安全培训合格入井。"
      - "安全生产主体责任不落实，蓄意隐瞒采掘工作面、拒不执行监管指令、瞒报事故。"
    precursors:
      - "10月24日中班瓦检员发现10303回采工作面切眼内局部地段顶板受压变矮，距反掘10303运输巷迎头10m处岩层脱落被金属网兜住形成\"网兜\"，向矿长汇报后安排26日夜班维修（提前2天发现并安排处理）"
      - "事故时巷道锚杆支护间距、排距为1.5m（作业规程要求0.8m），巷道边帮无支护，支护强度不足（支护不达标状态）"
      - "作业人员处理网兜时突发\"轰\"的一声，网兜岩石连带顶板碎石一起冒落（冒落前兆）"
    actions:
      - "发现顶板形成\"网兜\"等变形异常前兆后，立即停止网兜下方作业，先对失修区段施工锚索加强支护并设置临时支护，确认支护可靠后再处理网兜。"
      - "处理网兜严格执行专项安全技术措施，施工地点采取临时支护和防止失修范围扩大措施，按先支后拆、先顶后帮、由外向里原则作业，严禁空顶作业。"
      - "巷道开掘前查明周边地质构造、顶底板围岩结构并测定岩石物理力学参数，实行\"一巷一设计\"锚杆支护设计，支护强度匹配围岩条件。"
      - "对压力显现巷道采用架棚、单体液压支柱补强或注浆加固等加强支护；带班矿领导、安全员发现违章立即制止，严禁安排未经安全培训合格人员上岗。"
    outcome: "造成1人死亡、1人受伤，直接经济损失260.8万元；事故后煤矿蓄意隐瞒不报，建议责令自2022年12月8日起停产整顿3个月、暂扣安全生产许可证。"
    lessons:
      - "顶板岩层节理发育、破碎区段必须严格按规程支护，严禁随意降低支护标准（实际锚杆间距排距1.5m、规程要求0.8m）。"
      - "发现\"网兜\"等顶板异常必须执行专项措施，先采取临时支护再处理，严禁网兜下方和空顶冒险作业。"
      - "严禁安排未经安全培训合格的从业人员入井作业，安全技术措施必须组织贯彻学习。"
      - "隐瞒采掘工作面、拒不执行监管指令、瞒报事故属严重违法违规行为，将受到从严处罚并纳入联合惩戒对象。"
    source: "宣威市能拓矿业有限公司\"10·26\"顶板（瞒报）事故联合调查组（国家矿山安全监察局云南局牵头，曲靖市能源局、宣威市应急管理局等参加，2022年12月15日）"

  - case_id: "real-2023-001"
    location: "湖南省煤业集团嘉禾矿业有限公司浦溪井（湖南省嘉禾县行廊镇）24采区2454回风巷33m处维修作业点（巷道东侧为煤层、西侧为采空区，沿空留巷）"
    occurred_at: "2023-07-10T05:08:00"
    risk_level: "yellow"
    risk_level_original: "一般事故"
    causes:
      - "2454回风巷直接顶板为薄层状砂质泥岩，节理裂隙发育，处于小褶曲轴部应力集中，且沿空留巷时间长、顶板松动离层严重，具有冒落危险性。"
      - "作业人员违章作业：未及时抬双边楼加固，金属棚未打撑筒，棚腿未连锁，前探梁立柱数量不足，造成支护强度和稳定性不够。"
      - "现场管理不到位：矿长未将维修点作为重点部位安排带班矿领导巡查，跟班队干对违章冒险作业习以为常，离开作业点时未要求仅剩1人停止维修作业。"
      - "技术管理不到位：修理安全技术措施指导性不强、内容不完善（未明确金属钢棚连锁方式和维修架棚操作流程），审查把关不严。"
      - "双重预防机制落实不到位：安全检查员未及时发现垱头未抬双边楼加固、金属棚未设撑筒、棚腿未连锁等隐患，同类顶板隐患反复出现。"
    precursors:
      - "2454回风巷因压力大、变形严重，局部高度不足1m，无法正常开展支护回收作业（巷道受压变形、断面收敛）"
      - "直接顶为薄层状砂质泥岩，节理裂隙发育，处于小褶曲轴部应力集中，沿空留巷时间长、顶板松动离层严重（冒落危险性高）"
      - "维修作业面顶部及巷道东帮（煤层侧）煤矸比较松软；此前公司检查已发现支护柱腿不迎山、未按规程架棚、垱头未使用防倒装置、支护未抬楼加固等隐患"
    actions:
      - "维修巷道严格落实安全技术措施，使用好前探梁等临时支护（确保一梁三柱），空顶空帮处用纺织袋装煤矸充填，严禁空顶空帮作业。"
      - "按措施及时抬双边楼加固、金属棚打撑筒、棚腿连锁、前探梁立柱数量充足，棚距符合规定（不大于0.6m）、设防倒器并留足退路。"
      - "将应力集中、沿空留巷等顶板高风险维修地点列为重点部位、关键环节，安排带班矿领导巡查；维修人员不少于3人（一人操作、一名大工观察顶板支护、一人转运材料），严禁单人作业。"
      - "发现支护柱腿不迎山、未架棚、未抬楼加固等隐患立即停工整改，整改到位后再恢复作业。"
    outcome: "造成1人死亡，直接经济损失185.42万元；报告未提及停产及恢复情况。"
    lessons:
      - "沿空留巷、褶曲轴部应力集中区段顶板松动离层严重，维修作业必须严格落实抬双边楼、打撑筒、棚腿连锁等支护加固措施，严禁降低支护强度。"
      - "安全技术措施编制须深入现场确认环境、内容完善并经会签审核把关，编制后必须对作业人员贯彻学习。"
      - "现场管理要把巷道维修作业点作为重点部位、关键环节巡查，发现违章作业立即制止，严禁单人冒险作业。"
      - "双重预防机制要落地见效，同类顶板隐患不得反复出现，隐患整改须闭环销号。"
    source: "湖南省煤业集团嘉禾矿业有限公司浦溪井\"7·10\"顶板事故调查组（国家矿山安全监察局湖南局牵头，郴州市应急管理局、公安局、总工会参加，2023年7月31日）"

  - case_id: "real-2023-002"
    location: "河南省新郑煤电有限责任公司（郑煤集团直管矿井，位于河南省新郑市辛店镇境内）11采区11210工作面23#液压支架超前棚处（11210工作面位于11采区西翼中部）"
    occurred_at: "2023-08-27T12:48:00"
    risk_level: "yellow"
    risk_level_original: "一般事故（报告按死亡1人认定，未出现等级字样）"
    causes:
      - "直接原因：11210工作面受停采线附近SF4、F下19正断层及三面采空区影响应力集中、顶板破碎，作业人员违章站在22#、23#支架间采煤机电缆槽前处理顶板掉矸时，煤壁顶板发生片帮冒顶将其冲倒掩埋致死。"
      - "现场违章作业：处理顶板掉矸前未按规定采取敲帮问顶、打设抬棚加固、撞楔法超前护顶等措施，未确认安全撤离路线、未及时清理煤矸杂物致退路不畅通。"
      - "事故隐患未消除作业：8月26日4点班遗留的22#、23#支架超前棚未打设抬棚加固的事故隐患未汇报、未处理即组织作业，当班安全检查员未发现制止违章。"
      - "安全风险辨识评估不准确：将11210工作面收尾期间过应力集中区可能出现片帮、冒顶的风险评估为低风险（应为重大风险），郑煤集团备案审核未发现与实际情况不符。"
      - "安全教育培训不到位：未按规定组织对《11210工作面末采上网及扩超前棚安全技术措施》进行学习培训和考试，仅班前会进行部分内容学习。"
    precursors:
      - "12时30分许，张占锋发现23#液压支架超前棚处顶板掉矸（现象性前兆，无量化数值）。"
      - "8月26日4点班遗留隐患：22#、23#液压支架超前棚处未按措施打设抬棚加固（措施规定顶板压力显现时应沿倾向距煤墙300～500mm打设抬棚、一梁三柱）。"
      - "12时48分前安设荆笆时顶板掉矸情况加剧，现场人员喊出\"流渣了、撤\"（顶板流渣、流煤危急征兆，措施规定该情况须立即撤离至架间行人通道）。"
      - "地质前兆：受停采线附近SF4、F下19正断层和周边三面采空区影响应力集中，20#～23#液压支架段煤岩层起伏、顶板岩层破碎（无监测数值，为构造/采空影响描述）。"
    actions:
      - "严格执行\"敲帮问顶\"制度、严禁空顶作业，遇顶板破碎、过地质构造带及应力集中区须制定专项安全技术措施并监督落实。"
      - "顶板压力显现时沿倾向距煤墙300～500mm打设抬棚加固（一梁三柱并用防倒钢丝绳），遇片帮、流煤征兆采用撞楔法超前护顶，帮顶稳定确认安全后方可施工。"
      - "作业前清理施工地点浮煤杂物、确认并确保退路畅通，落实重点岗位关键环节现场安全确认制度，做到不安全不作业。"
      - "对排查出的事故隐患指定专人跟踪督促整改，在事故隐患消除前不得进行其他作业，实现隐患动态清零。"
    outcome: "造成1人死亡（张卷超，重度颅脑损伤），直接经济损失134.88万元；8月30日与遇难矿工家属签订赔偿协议，8月31日遗体在新郑市殡仪馆火化，善后处理完毕，矿区社会秩序稳定。"
    lessons:
      - "事故隐患必须及时消除后再作业，跟班队长、班组长对遗留隐患应登记并安排处理，严禁带隐患冒险施工。"
      - "过应力集中区、地质构造带等环节应辨识为重大风险并制定针对性管控措施，上级公司对风险辨识评估结果备案须严格审核把关。"
      - "作业规程和安全技术措施必须组织全员学习培训并考试合格后方准上岗作业，严防培训走过场。"
      - "事故发生后应按规定时限（1小时内）如实上报，杜绝迟报、瞒报、谎报事故。"
    source: "河南省新郑煤电公司\"8·27\"顶板事故调查组（国家矿山安全监察局河南局牵头，会同郑州市工业和信息化局、公安局、总工会等）· 2023年9月15日"

  - case_id: "real-2023-003"
    location: "枣庄王晁煤矿有限责任公司（隶属山东王晁煤电集团，位于山东省枣庄市滕州市级索镇境内）16101采煤工作面皮带巷切顶位置（161采区为-450m水平首采区）"
    occurred_at: "2023-09-09T09:30:00"
    risk_level: "yellow"
    risk_level_original: "一般事故（报告认定1人遇难、1人受伤，未出现等级字样）"
    causes:
      - "直接原因：皮带巷端头采用11#工字钢梁配合单体液压支柱、钢梁上方木垛接顶，支护强度不足，回撤端头切顶排支柱时老空侧顶板破碎矸石侧向漏冒，推垮三架钢棚，将孟召国砸倒埋压、将路过的谭伟砸伤。"
      - "现场安全动态管控差：在巷道超高位置未及时更换超高支柱，回柱放顶前未对端头及超前支护进行加固，工作面推采过断层后进入煤层底板泥岩未采取有效防止矸石漏冒措施。"
      - "技术管理薄弱：过断层等破碎带未严格执行工作面遇断层构造带安全防治规定，未辨识出16煤底板泥岩易风化、破碎导致顶板垮塌、漏冒、接顶木垛失稳等风险，未制定针对性管控措施。"
      - "安全监督检查不到位：过断层期间巷道超高、围岩破碎、管理难度大，带班领导及安全管理人员未对该作业地点重点盯靠和现场指导，安全检查工未及时发现支护方式稳定性差、强度不足问题。"
      - "安全教育培训不到位且抢险救援组织不力：职工自保互保意识薄弱，未执行\"一人操作、一人监护\"制度，违规卸载、回撤切顶支柱；事故后未按规定时限上报、未及时邀请专业救护队参与救援。"
    precursors:
      - "构造前兆：9月7日工作面揭露F8断层（走向70/250°、倾向160°、倾角80°、落差4.0m），事故发生时上端头（皮带巷侧）已推过断层进入断层下盘8m位置。"
      - "支护失稳前兆：受断层影响，皮带巷端头及附近6m超前支护段巷道高度达3.3m，采用高度2.5m单体液压支柱搭配工字钢梁支护、钢梁上方安装0.9m高木垛接顶，现场支护稳定性差、强度不足（巷道高度3.3m与支柱2.5m不匹配）。"
    actions:
      - "采掘工作面过断层（构造带）、过老巷及高应力集中区，必须严格落实作业规程和安全技术措施，必要时采取注浆加固及其他加强支护措施。"
      - "顶板来压、过断层（破碎带）等重点区域和关键环节必须落实现场盯守，带班领导和安管人员对重点作业地点现场指导、重点盯靠。"
      - "回柱放顶前对端头及超前支护进行加固，及时更换超高位置的不匹配支柱，杜绝支护强度不足、稳定性差情况下冒险作业。"
      - "严格执行\"一人操作、一人监护\"制度，严禁违规卸载、回撤切顶支柱；作业前确认支护状态稳定后方可施工。"
    outcome: "造成1人遇难（孟召国，18时经抢救无效死亡）、1人受伤（谭伟，生命体征正常），直接经济损失275.61万元；9月24日善后事宜处理完毕。"
    lessons:
      - "过断层（构造带）等高危环节必须提前开展风险辨识，针对泥岩风化破碎、顶板漏冒、接顶木垛失稳等风险制定并落实针对性管控措施。"
      - "支护形式与强度必须满足现场实际（巷道超高须更换匹配支柱），在支护强度不足、稳定性差的条件下严禁回柱等冒险作业。"
      - "事故发生后必须按规定时限如实上报并第一时间邀请专业救护队参与救援，严禁迟报及抢险组织不力。"
      - "上级集团公司对所属煤矿的安全监督检查须落到实处，对采掘工作面过断层等特殊阶段现场盯守，杜绝检查走形式、走过场。"
