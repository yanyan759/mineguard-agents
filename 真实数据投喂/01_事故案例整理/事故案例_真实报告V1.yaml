    risk_level_original: "一般顶板事故（生产安全责任事故，13人被困、1人遇难、2人受伤，直接经济损失194.97万元）"
    causes:
      - "过断层顶板淋水侵渗弱化：DF1断层受上覆采空区积水、砂岩裂隙水长期侵渗及盾构机掘进扰动，破碎带透水性增加、2月3日出现滞后淋水，降低岩层硬度与抗剪强度、破坏锚索粘结强度与锚固力，发生初次漏顶"
      - "漏顶处置违规：未辨识漏顶区顶板破碎、锚索生根不牢、顶板二次垮落风险，将手拉葫芦固定于漏顶附近支护锚索起吊临时棚，加剧顶板二次垮落致人员被埋"
      - "风险管控不全面：2月3日淋水增大后仅分析水害威胁，未分析对顶板支护影响；初次漏顶后未分析支护失效与二次垮落风险"
      - "支护技术管理不严格：未按掘进地质说明书对断层注浆加固，过断层支护参数无理论计算依据、未验算，补充施工安全技术措施未及时贯彻学习"
      - "支护质量管控缺失：过断层区域锚杆锚索未逐根检测、未编号管理，『班组自检、区队日检、矿井抽检』执行不到位，部分锚索尾部锚固于泥质粉砂岩中未生根于稳定岩层"
    precursors:
      - "2025年2月3日事故地点出现淋水成线现象（判定为砂岩裂隙水，无突水威胁）"
      - "2月16日10时许发现碎矸石随淋水从钢筋网眼掉落，13时41分风筒被巷道顶板掉落的矸石砸脱节"
      - "2月16日14时25分发现巷道右侧漏顶（长3m×宽2m×高0.8m），现场挂牌整改"
      - "矿压观测仅5#测站（G8点前80m）顶部锚杆载荷增加12MPa，其余测站监测值均无明显变化"
    actions:
      - "断层带出现滞后淋水、掉矸、漏顶等异常征兆时，立即停止掘进及漏顶处置作业、撤出人员，评估顶板二次垮落风险并制定管控措施后再施工"
      - "过断层、应力集中区、淋水区等特殊地段须按地质说明书超前注浆加固顶板，支护参数按『一巷一设计』理论计算验算后施工"
      - "对断层带、淋水区等特殊区段加密矿压监测，设置合理预警值与临界值，发现锚杆载荷等监测值异常及时修改支护设计、调整支护参数"
      - "漏顶修护必须由外向里逐架作业，严禁在漏顶区域架设支架、将吊具固定于支护锚索起吊临时棚等冒险作业"
    outcome: "造成13人被困，其中1人遇难、2人受伤（李某轻伤、尹某未达工伤伤情界定标准），直接经济损失194.97万元；2月20日18时35分发现失联人员，2月24日与遇难职工家属签订《工伤事故善后处理协议书》"
    lessons:
      - "过断层等特殊地段要变被动过断层为超前治理，按掘进地质说明书对断层带注浆加固，防止水岩耦合弱化顶板"
      - "对断层带、应力集中区、淋水区开展专项风险辨识，系统分析采空区积水、断层、围岩变化等致灾因素叠加风险"
      - "支护设计须有理论验算依据，结合矿压监测动态调整，特殊区段合理设置矿压预警值与临界值"
      - "严格执行『班组自检、区队日检、矿井抽检』三级支护质量管控制度，锚杆锚索逐根逐排编号检测，确保锚索生根于稳定岩层；作业规程与补充安全技术措施须及时贯彻学习"
    source: "潘二煤矿『2·17』一般顶板事故调查组（国家矿山安全监察局安徽局组织，2025年2月24日成立，2025年4月1日报告），无文号"

  - case_id: "real-2025-002"
    location: "镇雄县宝树煤矿有限责任公司镇雄县宝树煤矿（昭通市镇雄县乌峰街道小河村，二盘区），116a1运输巷掘进工作面迎头（沿C5b煤层顶板掘进，147m~181m段为采空区再生顶板破碎区，迎头距最后1架U型棚2m）"
    occurred_at: "2025-04-24T09:57:00"
    risk_level: "yellow"
    risk_level_original: "一般顶板事故（生产安全责任事故，1人遇难，直接经济损失174.605万元）"
    causes:
      - "空顶作业（直接原因）：116a1运输巷掘进工作面处于C5b煤层采空区，顶板破碎、稳固性差，作业人员未进行临时支护即在迎头空顶区域施工锚索钻孔，顶板冒落砸伤致死"
      - "隐蔽致灾因素普查不清：2022年与2024年两次普查对C5b采空区结论不一致（4处/2处）未分析查清，修编作业规程未涉及采空区情况，误掘入再生顶板破碎区"
      - "现场安全管理失效：现场盯守人员未制止当班超循环掘进、空顶作业违章行为，未安排盯头包面安全员，迎头空顶、未使用临时支护隐患未督促整改到位"
      - "安全培训不到位：作业人员安全风险辨识能力不足、未及时发现顶板不稳固风险，安全意识差、冒险空顶作业"
      - "依法管矿意识不强：迟报事故，安全生产责任制落实不到位（生产技术科科长不参与安全管理）"
    precursors:
      - "116a1运输巷147~181m段顶板为再生顶板、结构破碎，掘进进入C5b煤层采空区，顶板破碎、稳固性差"
      - "2025年3月15日~22日第三循环探放水钻孔预计巷道前方约60m揭露C5b煤层采空区"
      - "当班9时左右带班矿领导李某钟、安全员杨某发现迎头已掘进1m多未及时支护，口头要求先临时支护再打锚索"
      - "事故瞬间前郑某守敲帮问顶后未临时支护即在空顶区施工锚索，第二根钻杆施工时迎头右侧顶板突然冒落"
    actions:
      - "掘进迎头必须使用可靠的临时支护（前探梁、机载临时支护装置等），严禁空顶作业，做到一掘一支、随掘随支"
      - "掘进揭露老空、再生顶板破碎带前超前探查采空区，按补充安全技术措施采用『超前管棚+U型棚』加强支护后再施工"
      - "矿领导、安全员发现超循环掘进、空顶未支护等违章行为时，立即制止并要求先支护后作业，整改到位前严禁继续掘进"
      - "作业前严格执行『敲帮问顶』，及时摘除危岩活矸，辨识顶板稳固性风险后方可组织作业"
    outcome: "造成1人遇难（郑某守被冒落顶板砸倒，送毕节市第一人民医院抢救无效于当日17时10分死亡），直接经济损失174.605万元；对宝树煤矿处70万元罚款、责令停产整顿、暂扣安全生产许可证并降低安全生产标准化等级"
    lessons:
      - "严禁空顶作业，掘进必须使用可靠临时支护并做到一掘一支，作业规程循环进尺、临时支护要求必须严格执行"
      - "隐蔽致灾因素必须动态普查、查清查透，普查结论不一致时要进一步查明，未探明老空区前严禁采掘作业"
      - "落实现场盯守与盯头包面安全员制度，及时制止超循环掘进、空顶作业等违章行为，隐患发现后须督促整改到位"
      - "加强顶板异常征兆辨识与顶板灾害防治培训，提升作业人员风险辨识能力；发生事故须按规定时限如实上报，严禁迟报"
    source: "镇雄县宝树煤矿有限责任公司『4·24』一般顶板事故调查组（国家矿山安全监察局云南局牵头会同昭通市能源局等成立，2025年5月23日），无文号"

  - case_id: "real-2025-003"
    location: "中煤新登郑州煤业有限公司（河南省登封市告成镇）南翼煤柱综采工作面装架通道掘进工作面迎头处（二1煤层顶板+90南翼轨道巷第一联络巷向里50m处开口巷道）"
    occurred_at: "2025-09-15T13:34:00"
    risk_level: "yellow"
    risk_level_original: "一般事故（造成1人死亡）"
    causes:
      - "违规掏挖迎头煤（岩）墙下部煤体及中部离层砂岩矸石，违反作业规程先上后下、先顶后帮要求"
      - "伞檐形成后未及时清理活矸危岩、未采取临时支护，人员冒险进入伞檐下用风镐落底作业"
      - "现场安全管理不到位，当班班长未消除伞檐、退路不畅通隐患并撤离人员，跟班副队长未按规定巡回检查"
      - "掘进工艺由综掘变为人工风镐、手镐前未开展专项安全风险辨识评估，落后工艺致现场人员集中风险增大"
      - "安全教育培训不到位，部分作业人员不清楚作业规程内容，自保互保意识差"
    precursors:
      - "13时17分许迎头煤（岩）墙中部部分离层砂岩矸石片落，形成距巷道底板约1.3m、深约0.45m的伞檐（冒落前约17分钟的前兆现象）"
      - "班组长作业前安全确认发现轨道有点高、巷高也不够，巷道断面净高不足"
      - "风险辨识已列出片帮冒顶、退路不畅作业风险，但矿车紧邻迎头煤（岩）墙停放造成退路不畅通"
      - "迎头煤（岩）墙揭露上部碳质泥岩厚0.6m、中部细粒砂岩厚1.25m、下部二1煤层厚0.8m的离层结构"
    actions:
      - "发现迎头煤（岩）墙片落形成伞檐时，立即停止掏挖、落底作业，撤出伞檐下方及危险区域人员"
      - "及时清理活矸危岩，无法挑下的伞檐采取临时支护措施，严禁空顶、无支护冒险作业"
      - "严格执行敲帮问顶和先上后下、先顶后帮制度，掏挖作业前先处理迎头危岩；保持退路畅通，矿车不得紧邻迎头停放"
      - "采掘工艺发生重大变化或临时工程开工前，先开展专项安全风险辨识评估并制定针对性管控措施"
    outcome: "造成1人死亡，直接经济损失162万元；事故后责令新登煤业停产整顿、暂扣安全生产许可证，并处70万元罚款，责令河南分公司向中煤资源发展集团有限公司作书面检查"
    lessons:
      - "淘汰落后的人工风镐、手镐掘进工艺，采用机械化掘进并组建专业化掘进队，提升安全保障可靠性"
      - "采掘工艺发生重大变化或临时工程开工前，必须开展专项安全风险辨识评估并落实针对性管控措施"
      - "深入推进以危险预知、安全确认、安全站位、作业流程为核心的四位一体岗位标准化作业流程，严控违章冒险作业"
      - "事故发生后必须第一时间如实上报，严禁迟报、谎报、瞒报"
    source: "国家矿山安全监察局河南局（事故调查组，会同郑州市工业和信息化局、公安局、总工会）· 中煤新登郑州煤业有限公司9·15顶板事故调查报告"
