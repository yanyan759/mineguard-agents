  - case_id: "real-2024-001"
    location: "渑池县九六八煤业有限责任公司（渑池县坡头乡），12采区12100采煤工作面切眼下段（下机巷至中联巷，1#~84#悬移支架区域，事故点在10#悬移支架附近）"
    occurred_at: "2024-04-20T12:10:00"
    risk_level: "yellow"
    risk_level_original: "一般事故（生产安全责任事故，1人死亡、直接经济损失164万元，报告未单独列示等级认定）"
    causes:
      - "违规爆破作业：第2次爆破长度达25m，超过作业规程『一次起爆距离不超过10m』规定，空顶面积大、岩墙承压增大，致破碎岩体片帮、60#悬移支架处石核（0.45m×0.42m×0.35m）脱落滚落砸人"
      - "防滚矸安全措施不落实：10#~60#悬移支架50m区间仅设3道防护网（规程要求行人侧每隔10m一道），未执行『三人连锁爆破』制度，班长爆破后未检查爆破区域"
      - "技术管理不到位：切眼下段坡度增至30°、岩层夹杂较大石核等新情况未及时发地质预报，未修改作业规程或补充安全措施，原防护网强度不足以阻挡较大石核"
      - "安全风险辨识和隐患治理存漏洞：月度风险辨识未辨识出煤（岩）墙体破碎片帮伤人风险，防护网数量不够隐患未整改"
      - "培训与持证管理不到位：跟班队长等不清楚一次起爆距离规定，爆破特种作业资格证过期仍从事爆破作业，部分人员不携带人员位置标识卡入井"
    precursors:
      - "2024年4月以来煤层倾角逐渐增大，至事故时工作面切眼下段坡度30°（2024年3月前为17°~22°，平均19°）"
      - "岩层赋存不稳定，厚度0~4.9m，41#~44#支架区域为煤岩交界、45#~82#支架区域为全岩，全岩为沙质泥岩、质地松散且夹杂大小不一鹅卵石形状石核"
      - "事故前姚群民等在60#悬移支架处岩墙上发现一个露出的较大鹅卵石形状石核，用撅头撬未撬动"
      - "第2次爆破后岩墙一侧岩体破碎片帮，掉落的渣块夹杂较大石核沿斜巷向下滚落（事故瞬间）"
    actions:
      - "发现岩墙破碎、石核松动、片帮滚矸等征兆时，立即停止采掘作业并撤出滚矸滚石危险区域下方人员"
      - "按规程在斜巷行人侧每隔10m加设防护网并提高强度，使其足以阻挡较大滚矸，杜绝凑数、强度不足"
      - "煤层倾角增大、岩层赋存变化、夹杂石核等地质异常出现时，立即发地质预报并修改作业规程或补充安全措施后再作业"
      - "爆破作业严格执行『一炮三检』『三人连锁爆破』，严禁超范围超药量爆破，爆破后由班组长、爆破工及时检查支架顶板情况"
    outcome: "造成1人死亡（张从志被滚石砸中致死），直接经济损失164万元；责令九六八煤业停产整顿、暂扣安全生产许可证，2024年4月30日与遇难家属达成赔偿协议；矿长、法定代表人迟报事故（4月22日17时10分才上报）"
    lessons:
      - "严禁超范围、超药量爆破，必须严格执行『一炮三检』『三人连锁爆破』制度并保持特种作业持证有效"
      - "采掘工作面地质条件变化（坡度增大、岩层夹杂石核）时须及时发地质预报并同步修改作业规程或补充安全措施，防护设施要与实际风险强度匹配"
      - "安全风险辨识与隐患治理必须落地：月度风险辨识要覆盖煤岩墙体片帮伤人风险，防护网数量不足等隐患须及时整改"
      - "强化规程宣贯与安全教育培训，严禁人员不携带标识卡入井；发生事故须按规定时限如实上报，杜绝迟报"
    source: "九六八煤业『4·20』顶板事故调查组（国家矿山安全监察局河南局会同渑池县政府等单位成立），无文号"

  - case_id: "real-2024-002"
    location: "河北省承德市承德县，承德县兴程矿业有限公司（兴程矿）201运架联巷掘进工作面迎头（上山掘进，破煤层底板进入岩层，用于201工作面支架运输）"
    occurred_at: "2024-07-04T11:00:00"
    risk_level: "yellow"
    risk_level_original: "一般（一般生产安全责任事故，类别为顶板事故）"
    causes:
      - "直接原因：上山掘进的201运架联巷迎头上部泥岩与下部粉砂岩粘结不紧密，上部大块泥岩片落砸中作业人员致其遇难"
      - "安全风险辨识能力不足：迎头已发生煤岩片落后，现场人员未能辨识出存在再次片落风险，仍靠近迎头作业"
      - "现场安全管理不到位：作业人员未按《201运架联巷掘进施工安全技术措施》施工，敲帮问顶工作不彻底"
      - "安全技术措施缺乏针对性：措施中未制定预防上山掘进迎头片冒的专项措施，现场作业无安全施工具体依据"
      - "安全教育培训不到位：现场班组长未经专门班组长培训，掘进二队措施贯彻学习走过场，作业人员对措施要求不熟悉"
    precursors:
      - "打炮眼过程中（9时30分许）迎头中下部先片落两块岩石块（老底粉砂岩，单块约0.6m×0.7m×0.5m），找掉后人员仍滞留迎头作业"
      - "事故现场勘查：迎头顶部煤层及直接底有片冒迹象，煤岩片帮后形成的无支护空间距最近金属拱形支架约400mm"
      - "巷道底板见片落煤矸石，体积约0.8m×0.6m×0.7m"
    actions:
      - "发现迎头煤岩片落、片帮迹象时立即停止作业，撤出迎头人员，不得在未支护危险区逗留"
      - "严格执行敲帮问顶制度：用长柄工具由外向内处理干净顶帮活矸（煤），有经验老工人操作并设专人观山，两人站于支护完好位置"
      - "对已发生片落的迎头，确认支护可靠、无再次片落风险并消除隐患后方可恢复作业"
      - "迎头及时跟进前探梁临时支护，缩小煤岩片帮形成的无支护空间，防止空顶作业"
    outcome: "造成1人遇难，直接经济损失127.278万元（人身伤亡费用5.666万元、善后处理费用121.612万元）；国家矿山安全监察局河北局等下达责令全矿井停止生产、撤出现场作业人员的执法文书"
    lessons:
      - "牢固树立人民至上、生命至上理念，深刻吸取葛泉矿东井3·29顶板事故教训，反三违力度不足导致现场违章看惯习惯"
      - "现场安全管理必须到位，严格执行敲帮问顶制度并认真安全确认，对上山掘进顶板安全风险研判不足、隐患排查治理不到位"
      - "安全技术措施须有针对性，在风险预判基础上编制，针对上山掘进迎头片冒拟定专项支护内容"
      - "安全教育培训必须到位，班组长须经专门培训并考核合格，安全技术措施宣贯到每名职工并考核"
      - "上级公司要履行安全监管职责，强化顶板风险源辨识评估、动态研判和过程管控"
    source: "国家矿山安全监察局河北局（hb.chinamine-safety.gov.cn）·承德县兴程矿业有限公司\"7·4\"一般顶板事故调查组（2024年8月30日），无文号"

  - case_id: "real-2024-003"
    location: "河北省唐山市，河北唐山开滦（集团）有限责任公司钱家营矿业分公司（钱家营矿）2972W运道掘进工作面迎头11.1m范围内（矿井二水平西翼九采区7#煤层，锚网支护矩形断面巷宽5.3m、巷高3.5m，设计长1315m，事发时已掘进538m）"
    occurred_at: "2024-10-23T04:20:00"
    risk_level: "orange"
    risk_level_original: "较大（较大顶板事故，生产安全责任事故）"
    causes:
      - "直接原因：未查清2972W运道冒顶及临近区域顶板岩层地质异常变化，支护设计不合理、支护强度不达标，加安全技术措施不落实，顶板岩层破坏范围超出锚杆支护长度（无锚索支护）致岩层冒落"
      - "地质探查不清：掘进中仅凭作业人员识别钻孔排渣水颜色判岩层岩性，结果与钻孔窥视明显不符，离迎头最近探查孔（10#孔）距迎头88m，无法及时掌握迎头地质变化"
      - "支护设计不合理：规程规定锚索距迎头不超过30m，锚索未紧跟迎头，仅靠锚杆无法控制锚固区外的离层和破坏，应对地质变化可靠性不足"
      - "安全技术措施未落实：事故发生前3天顶板成型不好、顶板碎，冒顶区仅锚杆支护，正常8.0m锚索滞后迎头约22m，未执行顶板破碎或压力大时锚索紧跟迎头、加密布置的规定"
      - "顶板离层指示仪安设不规范：2972W运道离层仪距迎头88m，违反作业规程，无法监测迎头附近离层"
    precursors:
      - "事故发生前3天巷道顶板成型不好、顶板破碎"
      - "冒顶区仅锚杆支护，正常施工的8.0m锚索滞后掘进迎头约22m，且冒顶区顶锚索距迎头最近约22m"
      - "2972W运道开口往里约100m范围内顶板明显下沉，部分顶板锚杆托盘、锚索托板有压翻现象，帮部锚杆断裂、钢筋梯梁变形断裂，帮鼓明显"
      - "顶板离层指示仪距迎头88m（安设距离过远，无法监测迎头离层变化，属前兆监测缺失）"
    actions:
      - "顶板出现破碎、成型差、下沉或锚杆锚索受力异常时，立即停止掘进并撤出迎头作业人员，禁止带隐患作业"
      - "严格执行顶板破碎或压力大时锚索紧跟迎头、锚索加密布置（五花布置）的作业规程要求，强化特殊区段支护"
      - "掘进过程中采用钻孔窥视等有效探测方法，及时观测分析顶板岩层结构及岩性变化，动态修正支护设计"
      - "规范安设顶板离层仪并加密测点，对破碎带、大面积淋水及应力影响段等特殊区段科学分析监测数据，及时发布预警并采取处置措施"
    outcome: "造成4人遇难、2人受伤，直接经济损失950.3198万元；救援经小导硐改29U支架全断面架棚施工，24日救出2名生命体征平稳人员，31日找到全部4名遇难者，未发生次生灾害；停产及恢复情况报告未明确（【需补】）"
    lessons:
      - "矿井须牢固树立安全发展理念，摒弃抢生产、抢进度、长期高强度满负荷生产的倾向，不牺牲安全保产量"
      - "做实隐蔽致灾因素普查，采用钻探、物探、化探等方法全面普查地质构造，按就高不就低原则调整灾害设防等级"
      - "支护设计必须基于巷道围岩地质力学评估和修正后的地质说明书，锚索紧跟迎头，加强锚杆锚索载荷监测"
      - "技术管理与现场管理并重，严格执行作业规程审查，规范安设顶板离层仪，上级公司与监管部门须堵塞管理漏洞、提高监管效能"
    source: "国家矿山安全监察局河北局（hb.chinamine-safety.gov.cn）·河北唐山开滦（集团）有限责任公司钱家营矿业分公司\"10·23\"较大顶板事故调查组（2024年12月），无文号"

