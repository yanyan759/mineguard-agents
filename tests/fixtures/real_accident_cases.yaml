- case_id: real-2022-005
  location: 宣威市能拓矿业有限公司烂坝煤矿（云南省宣威市乐丰乡新月村委会境内）10303回采工作面反向炮掘运输巷维修作业点（沿C3煤层走向布置，直接顶为泥质粉砂岩厚4～8m）
  occurred_at: '2022-10-26T05:52:00'
  risk_level: yellow
  risk_level_original: 一般事故
  causes:
  - 事故地点顶板岩层节理发育、破碎且未按规定进行支护，岩层脱落被金属网兜住形成"网兜"。
  - 作业人员在未采取临时支护措施的情况下站在"网兜"下方剪开金属网，网兜岩石连带顶板碎石一起冒落。
  - 未按作业规程支护（事故时锚杆间距、排距为1.5m，规程规定0.8m，巷道边帮无支护），未按措施在距维修点5m处施工锚索加强支护。
  - 现场安全管理不到位，带班矿领导、安全员发现违章冒险作业未制止，"三违"突出；6名作业人员未经安全培训合格入井。
  - 安全生产主体责任不落实，蓄意隐瞒采掘工作面、拒不执行监管指令、瞒报事故。
  precursors:
  - 10月24日中班瓦检员发现10303回采工作面切眼内局部地段顶板受压变矮，距反掘10303运输巷迎头10m处岩层脱落被金属网兜住形成"网兜"，向矿长汇报后安排26日夜班维修（提前2天发现并安排处理）
  - 事故时巷道锚杆支护间距、排距为1.5m（作业规程要求0.8m），巷道边帮无支护，支护强度不足（支护不达标状态）
  - 作业人员处理网兜时突发"轰"的一声，网兜岩石连带顶板碎石一起冒落（冒落前兆）
  actions:
  - 发现顶板形成"网兜"等变形异常前兆后，立即停止网兜下方作业，先对失修区段施工锚索加强支护并设置临时支护，确认支护可靠后再处理网兜。
  - 处理网兜严格执行专项安全技术措施，施工地点采取临时支护和防止失修范围扩大措施，按先支后拆、先顶后帮、由外向里原则作业，严禁空顶作业。
  - 巷道开掘前查明周边地质构造、顶底板围岩结构并测定岩石物理力学参数，实行"一巷一设计"锚杆支护设计，支护强度匹配围岩条件。
  - 对压力显现巷道采用架棚、单体液压支柱补强或注浆加固等加强支护；带班矿领导、安全员发现违章立即制止，严禁安排未经安全培训合格人员上岗。
  outcome: 造成1人死亡、1人受伤，直接经济损失260.8万元；事故后煤矿蓄意隐瞒不报，建议责令自2022年12月8日起停产整顿3个月、暂扣安全生产许可证。
  lessons:
  - 顶板岩层节理发育、破碎区段必须严格按规程支护，严禁随意降低支护标准（实际锚杆间距排距1.5m、规程要求0.8m）。
  - 发现"网兜"等顶板异常必须执行专项措施，先采取临时支护再处理，严禁网兜下方和空顶冒险作业。
  - 严禁安排未经安全培训合格的从业人员入井作业，安全技术措施必须组织贯彻学习。
  - 隐瞒采掘工作面、拒不执行监管指令、瞒报事故属严重违法违规行为，将受到从严处罚并纳入联合惩戒对象。
  source: 宣威市能拓矿业有限公司"10·26"顶板（瞒报）事故联合调查组（国家矿山安全监察局云南局牵头，曲靖市能源局、宣威市应急管理局等参加，2022年12月15日）
