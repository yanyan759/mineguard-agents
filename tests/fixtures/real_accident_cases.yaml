- case_id: real-2025-003
  location: 中煤新登郑州煤业有限公司（河南省登封市告成镇）南翼煤柱综采工作面装架通道掘进工作面迎头处（二1煤层顶板+90南翼轨道巷第一联络巷向里50m处开口巷道）
  occurred_at: '2025-09-15T13:34:00'
  risk_level: yellow
  risk_level_original: 一般事故（造成1人死亡）
  causes:
  - 违规掏挖迎头煤（岩）墙下部煤体及中部离层砂岩矸石，违反作业规程先上后下、先顶后帮要求
  - 伞檐形成后未及时清理活矸危岩、未采取临时支护，人员冒险进入伞檐下用风镐落底作业
  - 现场安全管理不到位，当班班长未消除伞檐、退路不畅通隐患并撤离人员，跟班副队长未按规定巡回检查
  - 掘进工艺由综掘变为人工风镐、手镐前未开展专项安全风险辨识评估，落后工艺致现场人员集中风险增大
  - 安全教育培训不到位，部分作业人员不清楚作业规程内容，自保互保意识差
  precursors:
  - 13时17分许迎头煤（岩）墙中部部分离层砂岩矸石片落，形成距巷道底板约1.3m、深约0.45m的伞檐（冒落前约17分钟的前兆现象）
  - 班组长作业前安全确认发现轨道有点高、巷高也不够，巷道断面净高不足
  - 风险辨识已列出片帮冒顶、退路不畅作业风险，但矿车紧邻迎头煤（岩）墙停放造成退路不畅通
  - 迎头煤（岩）墙揭露上部碳质泥岩厚0.6m、中部细粒砂岩厚1.25m、下部二1煤层厚0.8m的离层结构
  actions:
  - 发现迎头煤（岩）墙片落形成伞檐时，立即停止掏挖、落底作业，撤出伞檐下方及危险区域人员
  - 及时清理活矸危岩，无法挑下的伞檐采取临时支护措施，严禁空顶、无支护冒险作业
  - 严格执行敲帮问顶和先上后下、先顶后帮制度，掏挖作业前先处理迎头危岩；保持退路畅通，矿车不得紧邻迎头停放
  - 采掘工艺发生重大变化或临时工程开工前，先开展专项安全风险辨识评估并制定针对性管控措施
  outcome: 造成1人死亡，直接经济损失162万元；事故后责令新登煤业停产整顿、暂扣安全生产许可证，并处70万元罚款，责令河南分公司向中煤资源发展集团有限公司作书面检查
  lessons:
  - 淘汰落后的人工风镐、手镐掘进工艺，采用机械化掘进并组建专业化掘进队，提升安全保障可靠性
  - 采掘工艺发生重大变化或临时工程开工前，必须开展专项安全风险辨识评估并落实针对性管控措施
  - 深入推进以危险预知、安全确认、安全站位、作业流程为核心的四位一体岗位标准化作业流程，严控违章冒险作业
  - 事故发生后必须第一时间如实上报，严禁迟报、谎报、瞒报
  source: 国家矿山安全监察局河南局（事故调查组，会同郑州市工业和信息化局、公安局、总工会）· 中煤新登郑州煤业有限公司9·15顶板事故调查报告
