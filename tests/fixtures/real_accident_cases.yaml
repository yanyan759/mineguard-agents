- case_id: real-2022-006
  location: 新泰市羊泉矿业有限公司（羊泉煤矿）一采区-204m水平2煤1210补掘巷掘进工作面，位于一采区2煤1206、1208回采工作面残留孤岛煤柱内（埋深456.8m），冒顶区域为1210补掘巷平巷段、上山段（第二段）及与之临近的2段老巷道
  occurred_at: '2022-06-05T23:40:00'
  risk_level: orange
  risk_level_original: 较大顶板事故（经调查认定该起事故为顶板事故；死亡3人，属于较大事故，为生产安全责任事故）
  causes:
  - 矿井无作业规程组织1210补掘巷掘进工作面施工，1210补掘巷揭露采空区后，未经现场勘查、技术会审、测量部门定位定向，掘进一区三队擅自确定开门点位置、调向施工，盲目揭露老巷道，造成巷道断面跨度增大（由3.2m增加到6m），未及时调整支护方式及支护参数加强支护，违章安排不施工帮部锚杆和顶板锚索，爆破作业后迎头未进行永久支护，空顶空帮作业，巷道支护强度不足，顶板岩石离层失稳，整体垮塌冒落，导致事故发生。
  - 羊泉煤矿违法违规组织生产，采用国家明令淘汰的“巷道式采煤”工艺擅自开采1206、1208回采工作面残留孤岛煤柱，2020年11月以来擅自施工12条“探煤巷”“假矸石硐”，胡挖滥采、随意超设计长度、宽度施工出煤，现场未落实《1210补掘巷的安全技术措施》“先探后掘”的规定，多次无安全措施揭露采空区及老巷。
  - 羊泉煤矿蓄意逃避监管监察，绘制多套图纸应付检查，1206、1208回采工作面停采线、1210探煤巷、“假矸石硐”等未如实填图，采用“假密闭”、不设瓦斯检查点、不安装安全监控传感器、不设人员位置监测系统分站、下井人员不带定位卡和实行“人卡分离”等方式隐瞒作业地点，1210补掘巷实际施工位置与向监管部门备案位置不一致。
  - 技术管理虚化弱化，全矿负责采煤、掘进、地测、防治水、通防等技术管理工作的专业技术人员只有5名，未对掘进一区三队实施有效技术管理和技术指导，未编制1210补掘巷掘进工作面作业规程即对1210补掘巷开门放线，未按规定对煤巷围岩地质力学进行评估，未按规定对事故巷道进行顶板离层监测及围岩变形观测。
  - 开展风险分级管控和隐患排查治理工作不力，1210补掘巷位于残留孤岛煤柱内、周围被多条巷道切割形成非连续煤体、巷道施工扰动形成新的应力叠加，未分析周围采空区、老巷分布情况及顶底板完整性等地质条件，未辨识出应力叠加、顶板离层、顶板大面积垮落等安全风险，1210补掘巷锚索支护滞后、锚杆预紧力不足、联网不合格等事故隐患长期存在、重复出现，未实现闭环管理。
  precursors:
  - 1210补掘巷第二段调向开门时，沿右侧原一条探煤巷留设煤柱5m，随巷道向前掘进，迎头与老巷之间的煤柱逐渐变小，当掘进至14.4m时，巷道右帮煤壁垮落与2020年11月施工的老巷相透，迎头巷道跨度由3.2m扩大至6m。
  - 1210补掘巷平巷段沿2煤顶板掘进40m处揭露一老巷，继续掘进14m揭露1208回采工作面采空区，周围采空区、老巷分布情况未查明。
  - 第二段掘进过程中，掘进一区三队专门安排只施工顶板锚杆，在右帮靠近老巷侧仅支设6棵单体液压支柱（排距1.5m），未按规定施工两帮锚杆和顶板锚索；事故当班第一循环爆破后，迎头只采取前探梁临时支护措施就开始出煤，未进行永久支护，空顶空帮作业。
  - 现场对1210补掘巷12棵锚杆进行预紧力检查，有9棵锚杆预紧力达不到要求，现场支护强度不足；1210补掘巷锚索支护滞后、锚杆预紧力不足、联网不合格等事故隐患长期存在、重复出现。
  - 事故区域位于埋深456.8m的1206、1208工作面残留孤岛煤柱内，周围被多条巷道切割形成非连续煤体，下伏4煤、11煤已开采完毕，巷道施工扰动形成新的应力叠加，未进行顶板离层监测及围岩变形观测。
  actions:
  - 当现场条件发生变化、监测参数和顶板压力异常时，立即停止作业、撤出人员。
  - 采掘工作面、巷修作业等工程开工前必须编制作业规程，严格审批程序；现场遇断层、破碎带、过老空（老巷）等特殊情况，必须结合实际及时制定安全技术措施，并确保执行到位。
  - 加强对大跨度巷道、煤柱应力集中区、地质构造带等特殊区域顶板管理，优化支护设计，采用锚杆支护必须按规定对煤巷围岩地质力学进行评估，确保支护可靠。
  - 加强矿压监测、围岩观测和顶板离层监测工作，监测参数和顶板压力异常时立即停止作业撤人，不得在支护不到位、空顶空帮情况下组织出煤。
  - 常态化开展风险辨识，全面、系统地辨识作业环境等方面存在的安全风险，深入分析周围采空区、老巷分布情况及顶底板完整性等地质条件，辨识应力叠加、顶板离层等安全风险并落实分级管控责任和措施。
  outcome: 死亡3人（4名被困人员全部救出，1人生还，3人遇难，其中1人于6月8日8时31分在医院抢救无效死亡），直接经济损失509.2万元。6月7日21时41分最后一名被困人员救出、抢险救援结束，救援共投入4支救援队伍1000余人次、施工救援导硐45m；3名遇难矿工善后事宜于2022年6月14日处理完毕。处理结果：给予羊泉煤矿警告并处行政罚款315万元，相关责任人员个人行政罚款27.98万元，行政罚款总计342.98万元，2名事故责任人以涉嫌重大责任事故罪移送司法机关追究刑事责任（2022年6月27日被检察机关批准逮捕），责成新泰市人民政府向泰安市人民政府做出深刻检查。报告未载明矿井停产及恢复生产情况。
  lessons:
  - 树牢安全发展理念，严格落实企业主体责任，强化企业安全生产主体责任落实，增强“依法办矿、依法管矿”意识，守住安全生产底线。
  - 煤矿安全监管部门要持续保持“打非治违”高压态势，严厉打击擅自开采保安煤柱、隐瞒作业地点、胡挖滥采、以掘代采、提供虚假图纸资料等违法违规行为。
  - 强化技术管理，采掘工作面、巷修作业等工程开工前必须编制作业规程；加强对大跨度巷道、煤柱应力集中区、地质构造带等特殊区域顶板管理，优化支护设计；加强矿压监测、围岩观测和顶板离层监测工作，当现场条件发生变化、监测参数和顶板压力异常时，立即停止作业撤人。
  - 深化安全风险分级管控和隐患排查治理双重预防机制建设，深入开展隐蔽致灾因素普查和隐患排查治理工作，完善隐患的排查、登记、整治、监督、销号全过程闭环管理机制。
  - 加强安全教育和培训，提高职工自保互保和风险辨识意识，增强应知应会和岗位操作技能，杜绝违章指挥、强令他人冒险作业、违章作业等违法违规行为。
  source: 国家矿山安全监察局山东局（山东局）组织泰安市能源局、应急管理局、公安局、总工会等有关部门成立的新泰市羊泉矿业有限公司“6·5”较大顶板事故调查组，2022年7月28日，报告未载明文号
  metadata:
    source_url: https://sd.chinamine-safety.gov.cn/resource/sdcoal2021/att/202210/1567283f-a764-4196-9f11-f0a1d70d561a.pdf
    local_file: agent1/煤矿资料收集/05_近五年煤矿顶板事故通报/2022-06-05羊泉矿业较大顶板事故调查报告.pdf
    published_at: '2022-07-28'
- case_id: real-2023-001
  location: 湖南省煤业集团嘉禾矿业有限公司浦溪井（湖南省嘉禾县行廊镇）24采区2454回风巷33m处维修作业点（巷道东侧为煤层、西侧为采空区，沿空留巷）
  occurred_at: '2023-07-10T05:08:00'
  risk_level: yellow
  risk_level_original: 一般事故
  causes:
  - 2454回风巷直接顶板为薄层状砂质泥岩，节理裂隙发育，处于小褶曲轴部应力集中，且沿空留巷时间长、顶板松动离层严重，具有冒落危险性。
  - 作业人员违章作业：未及时抬双边楼加固，金属棚未打撑筒，棚腿未连锁，前探梁立柱数量不足，造成支护强度和稳定性不够。
  - 现场管理不到位：矿长未将维修点作为重点部位安排带班矿领导巡查，跟班队干对违章冒险作业习以为常，离开作业点时未要求仅剩1人停止维修作业。
  - 技术管理不到位：修理安全技术措施指导性不强、内容不完善（未明确金属钢棚连锁方式和维修架棚操作流程），审查把关不严。
  - 双重预防机制落实不到位：安全检查员未及时发现垱头未抬双边楼加固、金属棚未设撑筒、棚腿未连锁等隐患，同类顶板隐患反复出现。
  precursors:
  - 2454回风巷因压力大、变形严重，局部高度不足1m，无法正常开展支护回收作业（巷道受压变形、断面收敛）
  - 直接顶为薄层状砂质泥岩，节理裂隙发育，处于小褶曲轴部应力集中，沿空留巷时间长、顶板松动离层严重（冒落危险性高）
  - 维修作业面顶部及巷道东帮（煤层侧）煤矸比较松软；此前公司检查已发现支护柱腿不迎山、未按规程架棚、垱头未使用防倒装置、支护未抬楼加固等隐患
  actions:
  - 维修巷道严格落实安全技术措施，使用好前探梁等临时支护（确保一梁三柱），空顶空帮处用纺织袋装煤矸充填，严禁空顶空帮作业。
  - 按措施及时抬双边楼加固、金属棚打撑筒、棚腿连锁、前探梁立柱数量充足，棚距符合规定（不大于0.6m）、设防倒器并留足退路。
  - 将应力集中、沿空留巷等顶板高风险维修地点列为重点部位、关键环节，安排带班矿领导巡查；维修人员不少于3人（一人操作、一名大工观察顶板支护、一人转运材料），严禁单人作业。
  - 发现支护柱腿不迎山、未架棚、未抬楼加固等隐患立即停工整改，整改到位后再恢复作业。
  outcome: 造成1人死亡，直接经济损失185.42万元；报告未提及停产及恢复情况。
  lessons:
  - 沿空留巷、褶曲轴部应力集中区段顶板松动离层严重，维修作业必须严格落实抬双边楼、打撑筒、棚腿连锁等支护加固措施，严禁降低支护强度。
  - 安全技术措施编制须深入现场确认环境、内容完善并经会签审核把关，编制后必须对作业人员贯彻学习。
  - 现场管理要把巷道维修作业点作为重点部位、关键环节巡查，发现违章作业立即制止，严禁单人冒险作业。
  - 双重预防机制要落地见效，同类顶板隐患不得反复出现，隐患整改须闭环销号。
  source: 湖南省煤业集团嘉禾矿业有限公司浦溪井"7·10"顶板事故调查组（国家矿山安全监察局湖南局牵头，郴州市应急管理局、公安局、总工会参加，2023年7月31日）
