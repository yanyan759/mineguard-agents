- case_id: real-2021-001
  location: 新能矿业有限公司王家塔矿井，3-1煤南部东西胶运大巷掘进工作面（掘进至约2547米处）
  occurred_at: '2021-01-09T21:40:00'
  risk_level: yellow
  risk_level_original: 一般事故
  causes:
  - 直接原因：综掘二队生产班未按作业规程架设临时支护（前探梁未安设背板、未由外向内逐排施工），致顶板冒落；安监员违章进入已冒落区域被二次冒落矸石砸中致死
  - 公司超能力下达产量和进尺指标、倒排工期抢进度，减少掘进支护工艺环节，对违规支护长期失察
  - 现场安全管理不到位，对临时支护不可靠、锚杆施工顺序不按规定等习惯性违章行为失察
  - 技术管理与安全培训不到位，遇地质条件变化未及时补充修改作业规程，员工自保互保意识差
  precursors:
  - 直接顶为2.1米砂质泥岩、松散胶接、层理发育且夹煤线，顶板岩层松软破碎，掘进遇地质条件变化未及时修改作业规程
  - 临时支护前探梁未安设背板、锚固剂药卷卡在锚杆孔内，支护与施工处于不完好状态
  - 第一次顶板掉落矸石（约0.4米×0.5米×0.1米）砸伤人员后，仍有人员在临时支护不完好的顶板下休息并未撤离
  - 已发生冒落区域周边未设警戒，安监员再次进入冒落区后发生约2米×1.2米×0.3米二次大冒落
  actions:
  - 顶板首次出现掉矸、淋水等征兆时立即将人员撤离至永久支护下的安全位置，严禁在临时支护不完好的顶板下停留
  - 冒落发生后在冒落区周边设警戒并停止该区域作业，严禁冒险进入已发生冒落区域，待支护加固、风险消除后再恢复作业
  - 遇顶板松软破碎、层理发育等地质条件变化时，及时补充修改作业规程，严格执行短掘短支或采用掘锚一体先进支护工艺
  - 严禁超能力、超进尺组织生产，合理调整采掘接续，杜绝倒排工期抢进度削减支护环节
  outcome: 死亡1人（安监员王丕军）、受伤1人（班长洪秀华），直接经济损失300万元；报告未载明停产与恢复情况
  lessons:
  - 企业必须落实安全生产主体责任，严禁超能力下达产量进尺指标、鼓励超能力超进尺作业
  - 必须严格执行作业规程规定的支护顺序与工艺，坚决杜绝临时支护不设背板等习惯性违章
  - 强化安全教育培训，提升员工自保互保意识与风险辨识能力，人员受伤后应及时撤到永久支护下
  - 事故发生后须依法依规及时报告，杜绝迟报、瞒报
  source: 内蒙古煤矿安全监察局鄂尔多斯监察分局组织的事故调查组（会同鄂尔多斯市能源局、伊金霍洛旗能源局、纪委监委、公安局、应急管理局、总工会等）；报告无落款文号
