- case_id: real-2021-002
  location: 山东省济宁市微山县留庄镇境内枣庄矿业集团新安煤业有限公司31采区3上104运输巷外段巷道调向交岔点处（沿3上煤层底板掘进，煤层倾角9°～14°、平均11°，巷道为矩形断面锚网索支护）
  occurred_at: '2021-05-26T23:06:00'
  risk_level: orange
  risk_level_original: 较大顶板事故
  causes:
  - 直接原因：事故地点位于区域性断层和伴生断层叠加区，巷道顶板受断层切割形成不完整岩石块体，调向开门施工交岔点跨度不断扩大，支护强度不够，顶部岩石块体失稳滑落，引发顶板大面积垮落。
  - 对区域性断层和伴生断层探测不明、分析不够：未查明落差大于5米的断层等地质构造，巷道沿F2区域性断层掘进未超前探查F2断层，在断层破碎带中施工巷道44.7米后才停止掘进、后退调向；调向施工前未对交岔点区域受断层叠加影响进行深入分析，对交岔点附近围岩破碎、顶板稳定程度分析研判不准。
  - 巷道调向位置选择不当：调向施工交岔点处于区域性断层和伴生断层叠加区，围岩在两条断层的双重切割作用下形成不完整岩石块体，顶板破碎不稳定，刷帮巷道与原巷道夹角10°使交岔点区域长度达27m、断面跨度由4.8m扩大到9.2m，造成顶板控制困难。
  - 支护参数和支护方式不合理：在交岔点施工跨度不断扩大情况下未针对性地调整支护参数、支护方式，只选用锚（杆）索梁网支护并加密密度，未采取联合支护等强化措施、未调整锚（杆）索长度，致使锚（杆）索未锚固到稳定岩层中，锚固作用降低，支护强度不够。
  - 技术管理不到位、安全管理不到位：安全风险辨识不准，仅辨识出顶板存在“开门期间顶板跨度大容易发生掉矸伤人”的一般风险；技术措施编制缺乏针对性、程序不符合规定；规程措施落实不严，迎头后一组横向、一组纵向锚索梁和一棵加强锚索未及时施工，调向交岔点未安设顶板离层仪，安监员现场监督检查不到位。
  precursors:
  - 2021年5月12日施工至625m处在左帮揭露断层，分析为F2支断层、落差7m左右。
  - 2021年5月22日施工至670m处，通过钻探探查和顶板岩性分析确定为F2断层，落差22m，为避开断层自迎头退后54.4m，5月23日晚中班按夹角10°向右调向施工。
  - 事故地点位于区域性断层和伴生断层叠加区（F2断层落差22m、F2伴生断层落差2.0m、F3104-3断层落差5m，F2支断层落差约7m），顶板受断层切割破碎、形成不完整岩石块体。
  - 调向开门刷帮交岔点区域长度达27m，断面跨度由4.8m扩大到9.2m，顶板控制困难；调向交岔点未安设顶板离层仪，无顶板离层量监测数据。
  - 支护监测异常：早中班交接的迎头最前排4根顶部锚杆、1组横向锚索梁中，当班仅施工4根顶部锚杆即开始掘进，锚索、锚索梁未及时施工；冒落煤岩中锚杆、锚索与顶部煤岩体一起整体冒落，取出的顶板锚杆锚固长度仅约0.75m，未锚固到稳定岩层。
  - 现场勘查：冒落区起始点位于调向交岔点前方左帮7.25m、右帮8.05m处，冒落起点宽5.7m、终点最宽9.2m，冒落长度20m、面积约122m²，平均冒落高度约3.5m、最大约6.5m；冒落体由侏罗系泥质胶结砾岩、泥岩及煤层组成，伪顶岩石厚度约0.3～0.5m，局部可见0.2～0.6m但不连续的顶煤。
  actions:
  - 强化地质保障机制，深化地质探查和分析，查明落差大于5米断层等隐蔽致灾地质因素；巷道在断层构造复杂区施工必须采取超前物探与钻探相结合的方式探查，分析断层摆动、延展及影响范围。
  - 遇区域性断层及伴生断层叠加等构造复杂区域，应与设计部门共同分析研究、及时调整巷道布置和调向位置，尽量将掘进巷道布置在大断层、构造复杂区20米以外，降低过断层概率。
  - 在大跨度、地质构造带等特殊区域加强顶板管控，施工跨度不断扩大时应针对性地调整支护参数与支护方式，采取联合支护等强化措施并调整锚（杆）索长度，确保锚（杆）索锚固到稳定岩层。
  - 严格执行安全技术审批制度和规程措施，支护（顶部锚杆、锚索、锚索梁）未施工到位不得掘进；在调向交岔点等大跨度区域安设顶板离层仪并加强矿压（顶板动态）监测，发现异常及时预警撤人。
  - 严格矿领导带班下井和现场安全监督检查，落实“区域·点数”安全巡查制度，对重点作业地点加强巡查检查，及时排查消除顶板隐患，严防“三违”行为；加强安全教育培训，提高职工自保互保和风险辨识意识。
  outcome: 死亡3人、轻伤1人，直接经济损失928万元；事故共造成6名人员被困，经全力搜救3人生还（宋廷杰、周战军、李目国）、3人死亡（孙启磊、解朝波、黄庆），3名遇难矿工善后事宜于2021年6月17日全部处理完毕。事故发生后矿调度立即下达全矿井停产撤人指令并启动应急预案，矿井停产及恢复生产的具体情况报告未载明。
  lessons:
  - 对区域性断层和伴生断层探测不明、分析不够，未查明落差大于5米的断层等地质构造，巷道沿F2区域性断层掘进未超前探查，在断层破碎带中施工44.7米后才停止掘进、后退调向，教训深刻。
  - 巷道调向位置选择不当，调向施工交岔点处于区域性断层和伴生断层叠加区，围岩在两条断层双重切割作用下形成不完整岩石块体，交岔点跨度由4.8m扩大到9.2m，造成顶板控制困难。
  - 支护参数和支护方式不合理，交岔点施工跨度不断扩大时未采取联合支护等强化措施、未调整锚（杆）索长度，致使锚（杆）索未锚固到稳定岩层中，锚固作用降低、支护强度不够。
  - 技术管理不到位，安全风险辨识不准，仅辨识出顶板存在“开门期间顶板跨度大容易发生掉矸伤人”的一般风险，技术措施编制缺乏针对性、程序不符合规定，循环进尺与作业规程不符。
  - 安全管理不到位，规程措施落实不严，迎头后一组横向、一组纵向锚索梁和一棵加强锚索未及时施工，调向交岔点未安设顶板离层仪，安监员现场监督检查不到位，调向施工期间13个班次无矿级领导巡查检查。
  source: 山东煤矿安全监察局鲁南监察分局牵头，组织济宁市应急管理局、公安局、能源局、总工会等有关部门和单位成立枣庄矿业集团新安煤业有限公司“5·26”较大顶板事故调查组（山东煤矿安全监察局督导工作组监督指导）；调查报告落款2021年10月15日
  metadata:
    source_url: https://sd.chinamine-safety.gov.cn/resource/sdcoal2021/att/202203/6c76fa83-b0d9-47a9-b293-5a9af53f99e7.pdf
