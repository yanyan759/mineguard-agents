- case_id: real-2017-002
  location: 辽宁省沈阳焦煤股份有限公司红阳三矿西三上采区702综采工作面回风顺槽（开采深度约1082m，上方为北二采区703采空区，区间煤柱宽度32m）
  occurred_at: '2017-11-11T02:26:00'
  risk_level: red
  risk_level_original: 重大顶板（冲击地压）事故
  causes:
  - 直接原因：西三上采区702综采工作面开采深度为1082m，原岩应力高，煤层具有冲击倾向性；受断层构造（Fh1、Fh2、Fh3、Fh4、Fh21断层）、区间煤柱（702回风顺槽与北二703采区之间煤柱宽度32m）及702综采工作面采动（702工作面已推进1740m）等应力叠加影响，使事故区域形成高应力集中区；受Fh1、Fh21断层切割作用和采煤机割煤、移架放顶、3台钻机同时施工瓦斯抽采钻孔等因素扰动影响，造成该区域巷道周边煤岩失稳，诱发冲击地压，导致事故发生。
  - 间接原因：沈煤集团、沈焦公司和红阳三矿各级决策层和管理层机械教条的片面理解《煤矿安全规程》中关于冲击地压危险性鉴定的规定，对采深超过1000m带来的冲击地压问题认识不高、重视不够、研究不深，没有组织开展冲击地压危险性鉴定。
  - 间接原因：红阳三矿瓦斯治理理念落后，仅满足于采掘作业时瓦斯浓度不超限；瓦斯抽采手段单一，只是采取高位钻孔抽采卸压瓦斯和利用回顺尾巷埋管方式抽采瓦斯，没有采取区域治本的预抽瓦斯措施。
  - 间接原因：沈焦公司及红阳三矿对采区阶段煤柱留设存在的冲击地压风险辨识不到位，没有辨识出高应力条件下存在的采动应力诱发冲击地压安全风险；702综采工作面采深超1000m，支护措施上仍然按部就班、一成不变，没有实施相应的安全风险管控措施。
  - 间接原因：红阳三矿技术管理不到位——未按规定实施专人顶板离层监测和矿压观测，702综采工作面两顺超前支护段未安装矿压检测装备，矿压观测周期大于来压周期，矿压观测资料未组织分析研究，矿压显现规律不清楚；未按时开展702综采工作面地质素描、没有开展7#煤基本顶岩石抗压强度测定；702综采工作面生产作业期间同时安排3组打钻人员在回风顺槽集中施工高位抽采钻孔，现场劳动组织不合理；作业规程培训不认真，没有开展冲击地压防治相关内容培训。
  precursors:
  - 702综采工作面已于11月8日发生周期来压，根据以往经验值7#煤层采煤工作面顶板周期来压步距一般为25m，预计下次来压时间为11月13日（来压预警临近）。
  - 回风顺槽巷道破坏以上帮煤体整体移动以及底板底鼓为主，现场勘查见巷道上帮大部分锚杆锚固剂脱粘失效、部分锚索拉断，巷道顶板锚索露出部分向巷道下帮侧弯曲。
  - 破坏区段巷道严重变形：部分区段巷道基本合拢、顶底板距离仅剩0.3m，局部出现网兜、底鼓严重，部分单体支柱压弯、工字钢顶梁弯曲、刮板运输机被掀翻。
  - 矿压观测周期大于来压周期，未按规定实施专人顶板离层监测和矿压观测，矿压观测资料未组织分析研究，矿压显现规律不清楚。
  actions:
  - 按照冲击地压和煤与瓦斯突出复合灾害的防治要求核减生产能力、降低开采强度、严控入井作业人数，按照有安全保障的能力组织生产，坚决做到不安全不生产。
  - 启动安全生产双重预防机制：全方位、全过程对矿井致灾因素、开采工艺、环境条件等方面存在的安全风险进行系统排查梳理，全面辨识、科学评定安全风险等级，有效管控安全风险，把风险管控挺在隐患前面、把隐患排查治理挺在事故前面。
  - 立即开展冲击地压防治：建立冲击地压防治安全管理体系，设置专门防冲机构、配备专业技术人员，编制中长期防冲规划与年度防冲计划，认真研究和确定适应本矿的冲击地压危险性预警临界指标，科学划定冲击危险区域，按照“区域先行、局部跟进、分区管理、分类防治”原则编制防治冲击地压专门设计，合理安排开采顺序，科学留设煤柱、避免人为形成高应力集中区，选择适合的支护方式、提高巷道支护强度。
  - 严格冲击倾向性鉴定与危险性评价：组织开展本矿及相邻矿井各开采煤层与顶底板岩层的冲击倾向性鉴定、冲击危险性评价工作，采深超1000m时必须开展冲击地压危险性鉴定。
  - 加强技术管理与矿压监测：健全以总工程师为核心的技术管理体系，精准制订作业规程和安全措施并严格审查、审批和落实；按规定实施专人顶板离层监测和矿压观测，保证观测周期不大于来压周期，及时组织分析矿压观测资料，掌握矿压显现规律以科学指导采掘作业。
  - 优化瓦斯治理与劳动组织：超前规划、超前设计、超前施工，为瓦斯抽采提供充足的时间和空间，采取综合瓦斯防治措施实现抽、掘、采平衡；科学合理安排组织生产作业，优化抽采施工，打钻施工不得与采煤作业同时进行；加强冲击地压防治培训，提升作业人员冲击地压应急处置能力和安全避险能力。
  outcome: 事故造成10人死亡、1人轻伤，直接经济损失1456.6万元。经全力搜救，11月26日10时30分最后1名遇难人员遗体升井，抢险救援工作结束；救援过程中发现回风顺槽约200m巷道破坏严重、通风阻断，事故区域瓦斯浓度最高达45%，先期采取抽排瓦斯、恢复局部通风措施后进入灾区救援。停产及恢复生产情况报告未载明。
  lessons:
  - 煤矿企业必须坚守“发展决不能以牺牲安全为代价”的红线，正确处理安全与生产、安全与效益的关系，按有安全保障的能力组织生产，坚决做到不安全不生产。
  - 必须加强安全生产双重预防机制建设，全方位、全过程辨识矿井致灾因素、开采工艺、环境条件等方面的安全风险，科学评定风险等级，把风险管控挺在隐患前面、把隐患排查治理挺在事故前面，防范和遏制重特大事故发生。
  - 深井（采深超1000m）开采必须高度重视冲击地压问题，组织开展冲击地压危险性鉴定和煤层与顶底板岩层冲击倾向性鉴定，建立防冲体系、编制防冲专门设计，科学留设煤柱、合理安排开采顺序，避免人为形成高应力集中区，提高巷道支护强度。
  - 必须严格执行顶板离层监测和矿压观测制度，做到专人监测、观测周期不大于来压周期，及时分析矿压观测资料、掌握矿压显现规律，以科学指导具体采掘作业，防止矿压观测流于形式。
  - 瓦斯治理必须采取区域治本的综合预抽措施、实现抽掘采平衡，优化现场劳动组织，打钻施工不得与采煤作业同时进行；同时必须加强冲击地压防治培训，提高作业人员自主保安、群体保安意识和应急处置、安全避险能力。
  source: 经辽宁省人民政府批准，辽宁煤矿安全监察局会同原辽宁省监察厅、辽宁省煤矿安全监督管理局、辽宁省公安厅、辽宁省国有资产监督管理委员会、辽宁省总工会成立的红阳三矿“11·11”重大顶板事故调查组（下设技术组、管理组、责任追究组和综合组，并聘请5名煤矿冲击地压灾害防治专家）。事故调查组成立于2017年11月27日；报告未载明成文日期和文号。
