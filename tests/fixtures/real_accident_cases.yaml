cases:
- case_id: real-2017-001
  location: 山西中煤担水沟煤业有限公司（朔州市朔城区北部15km小平易乡担水沟村北，宁武煤田北部）一水平4-1号煤层4203综采工作面运输顺槽
  occurred_at: '2017-01-17T10:15:00'
  risk_level: red
  risk_level_original: 重大顶板事故（报告标题“1·17”重大顶板事故；类别认定为一起冲击地压引起的重大顶板事故，性质认定为生产安全责任事故）
  causes:
  - 直接原因：担水沟煤业超能力生产、生产布局集中、接替顺序不合理、巷道压力明显增大时未采取有效措施，致使采动应力叠加诱发冲击地压，是造成本次顶板事故的直接原因。
  - 间接原因：担水沟煤业对技术工作重视不够，管理不到位——矿井技术管理不到位，工作面设计布置时未考虑相邻回采工作面及上下煤层工作面开采扰动的影响，工作面布局集中，造成应力叠加；在4203综采工作面运输顺槽巷道压力明显增大、变形严重时，未采取有效措施。
  - 间接原因：担水沟煤业重生产、轻安全，安全管理混乱——违规将采掘工作面承包给没有煤炭生产资质的内蒙古神华建筑安装有限责任公司，且对外包队伍未能实施有效管控；违反规定多布置采掘工作面，超能力组织生产。
  - 间接原因：朔州矿业公司执行安全生产有关规定和制度不严格，安全管理松懈——未制止担水沟煤业超能力生产；日常安全检查和隐患排查治理工作不到位；对采掘接替紧张、上下煤层采掘工作面布置不合理、位于不同煤层的两个回采面近距离同时开采并导致矿压叠加的问题失察。
  - 间接原因：中煤资源发展公司对下属子公司及煤矿安全管理不到位——违规向担水沟煤业下达超能力生产指标；对所属煤矿安全监管不到位；对担水沟煤业长期和反复出现的顶板问题没有引起高度重视，未组织深入的技术论证分析和风险评估，未研究制定专项解决措施；朔城区人民政府和煤矿安全监管部门对担水沟煤业安全生产工作监管不到位。
  precursors:
  - 2016年7月底起，4203运输顺槽距工作面50m范围内出现底鼓、帮鼓和顶板离层等现象（2016年7月16日开始回采）。
  - 2016年8月1日会审通过《4203皮带顺槽巷修安全技术措施》并加强支护后，4203运输顺槽50m超前支护区域仍反复出现底鼓、帮鼓、网兜等现象。
  - 2016年11月起，运输顺槽50m超前支护区域压力明显增大，担水沟煤业仍要求综采一队沿用原巷修安全技术措施管理该区域。
  - 事故后勘察识别冲击地压的伴生特征：正常区域巷道顶板离层指示仪完好，紧邻冒顶垮帮段前方的10号、9号、8号连续3组离层仪钢丝破断；事故后一周内4次现场勘察时仍有明显的闷炮发生（均系动力显现特征，报告未给出能量、频次等量化数值）。
  actions:
  - 当超前支护区域出现底鼓、帮鼓、顶板离层、网兜等压力显现时，应立即加强矿压观测，准确掌握采煤工作面超前压力范围，采取针对性措施及时加强支护，合理选择支护方式及参数，严格锚索锚网现场施工。
  - 对巷道压力明显增大、反复变形等异常，应组织深入的技术论证分析和风险评估，制定专项解决措施，不得在压力明显增大时仍沿用一般巷修安全技术措施。
  - 工作面设计布置时应充分考虑相邻回采工作面及上下煤层工作面开采扰动的影响，优化开采设计，科学安排开采顺序，对围岩应力分布与变化准确分析，避免上下煤层和相邻工作面采动造成应力叠加、避免人为形成高应力集中区。
  - 严格按照批准的许可能力组织生产，严禁超能力、超定员、超强度组织生产，严禁将井下采掘工作面和井巷维修作业进行劳务承包，对外包队伍实施有效管控。
  - 相邻矿井在开采相同煤层时应当进行煤岩冲击倾向性鉴定，认真做好待采区段冲击地压危险性评价；鉴定为冲击地压矿井后必须严格按照冲击地压矿井的要求进行防冲管理，采取综合防冲措施；恢复生产前对冲击地压危险程度进行评价，制定科学的安全技术措施。
  - 加强防治冲击地压的安全培训，提高对冲击地压的辨识及避险能力。
  outcome: 死亡10人（含1名被困者刘文国被救出后经抢救无效死亡），直接经济损失1517.46万元。事故为冲击地压引起的重大顶板事故，认定为生产安全责任事故。报告建议暂扣担水沟煤业《安全生产许可证》并责令实行整顿恢复机制，整顿恢复期1年，整顿结束后履行复工复产验收程序、验收合格后方可恢复生产；实际停产时间与恢复生产日期报告未载明。
  lessons:
  - 必须严格落实核定生产能力组织生产，严禁超能力、超定员、超强度生产。担水沟煤业证载能力90万吨/年，2016年实际原煤产量520.05万吨，严重超能力生产，是事故的重要根源。
  - 采掘工作面布置与开采顺序必须合理，工作面设计布置时要充分考虑相邻回采工作面及上下煤层工作面开采扰动的相互影响，优化开采设计，避免上下煤层和相邻工作面采动造成应力叠加诱发冲击地压。
  - 对巷道反复出现的底鼓、帮鼓、网兜、顶板离层和压力明显增大等压力显现，必须保持高度警觉，深入分析论证、评估风险并制定专项解决措施，不得仅作为一般隐患简单处理。
  - 严禁违规将井下采掘工作面和井巷维修作业劳务承包给没有煤炭生产资质的队伍，对外包队伍必须实施有效管控。
  - 相邻矿井在开采相同煤层时应进行煤岩冲击倾向性鉴定和待采区段冲击地压危险性评价，鉴定为冲击地压矿井后必须落实综合防冲管理和防冲安全培训，提高对冲击地压的辨识及避险能力。
  source: 山西煤矿安监局于2017年1月21日组织省公安厅、安全监管局、煤炭厅、总工会等单位成立的中煤担水沟煤业有限公司“1·17”重大顶板事故调查组（聘请6名专家组成专家组协助调查）《中煤担水沟煤业有限公司“1·17”重大顶板事故调查报告》；报告文本未载明文号，调查认定事故性质为生产安全责任事故。
