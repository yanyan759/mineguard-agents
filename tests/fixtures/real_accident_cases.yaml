- case_id: real-2023-004
  location: 甘肃兰阿煤业有限责任公司阿井矿1421五分层准备工作面9#液压支架与上端头接茬处（急倾斜煤层，埋深540m，上端头采用π型钢梁配合单体液压支柱支护）
  occurred_at: '2023-11-22T18:57:00'
  risk_level: yellow
  risk_level_original: 一般（报告按1人死亡对应一般事故定性，责任处理建议引用安全生产法'一般事故'条款）
  causes:
  - 支架工在9#液压支架与上端头接茬处维修时降低支架，致使顶部大面积悬空，上部破碎煤体突然冒落将其压埋
  - 现场管理不到位：上端头顶部压力大，存在π型钢梁变形、单体液压支柱卸压钻底，未采取加强支护措施，支架维修无人监护
  - 技术管理不到位：未编制起底安全技术措施和专项爆破措施，当班违规爆破起底作业
  - 隐患排查治理不到位：爆破后未检查处理顶板、支架，多轮安全检查未排查出事故地点支护隐患
  - 安全教育培训不到位：作业人员顶板风险辨识能力不足，规程措施贯彻学习不到位
  precursors:
  - 上端头顶部压力大，出现π型钢梁变形、单体液压支柱卸压、钻底等支护失效现象
  - 顶部煤体破碎且支护接顶不实，液压支架存在漏液、窜液故障
  - 爆破起底作业结束后未按要求检查处理爆破区域顶板、支架情况
  actions:
  - 每班作业前使用检验合格的压力表检查液压支架、单体液压支柱初撑力，发现漏液损坏及时处置并建立检查台账
  - 液压支架维修等危险作业必须安排专人监护，严禁单人无监护作业
  - 起底、爆破作业须编制专项安全技术措施并经审批，爆破后按规程检查处理顶板、支架情况
  - 发现支护接顶不实、煤体破碎、支柱卸压钻底等征兆时立即停止作业、撤出人员并采取加强支护措施
  outcome: 造成1人死亡，直接经济损失134.1万元；对遇难者落实赔偿抚恤、善后处理妥当，应急处置未扩大伤亡（停产与恢复情况报告未提及）
  lessons:
  - 严禁在支护接顶不实、顶板压力集中区域冒险作业，支架维修必须专人监护
  - 起底、爆破等特殊作业必须编制并经审批专项安全技术措施，爆破后须检查顶板支架
  - 强化支护质量检测（初撑力检查）与隐患排查闭环管理，杜绝凭经验判断支护可靠性
  - 加强安全教育培训，提高作业人员顶板风险辨识与自保互保能力
  source: 甘肃兰阿煤业有限责任公司阿井矿"11·22"事故调查组（国家矿山安全监察局甘肃局发布，无文号，落款2023年12月18日）
