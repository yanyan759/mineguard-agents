- case_id: real-2022-004
  location: 山西长治沁源凤凰台煤业有限公司3#煤层31采区3102胶带顺槽掘进工作面（半煤岩巷，左右实体煤，上覆为2#煤层采空区，锚网梁索支护）
  occurred_at: '2022-08-04T00:00:00'
  risk_level: orange
  risk_level_original: 较大（较大顶板事故）
  causes:
  - 违反过断层安全技术措施"掘一排、支一排"规定，架棚支护已滞后迎头2.4米未补强即继续冒险掘进
  - 迎头4.5米范围内仅有锚网梁索支护，不足以支撑顶板压力，顶板结构失衡发生冒顶
  - 现场安全管理缺失：过断层期间未安排专职安全员监督，当班带班矿领导、驻矿安检员未到事故地点检查，班长违章指挥
  - 施工技术管理缺位：未查清掘进面上覆2#煤层开采历史和老空巷道布置情况，未组织学习并执行过断层措施
  - 日常安全管理混乱：入井检身不严、人员识别卡代打卡、特种作业人员冒名顶替、带班提前升井
  precursors:
  - 过断层地段架棚补强支护滞后掘进迎头2.4米（按措施应"掘一排支一排"），仅靠锚网梁索支护支撑顶板
  - 上覆为2#煤层采空区、顶板压力大，锚网梁索支护不足以支撑顶板压力
  actions:
  - 过断层等特殊地段严格执行"掘一排、支一排"，架棚支护滞后即停止掘进并及时补强支护
  - 发现支护强度不足或支护滞后时立即撤出作业人员，严禁在仅锚网梁索支护区域冒险掘进
  - 安排专职安全员对过断层掘进现场全程安全监督，带班矿领导、驻矿安检员必须到关键地点检查
  - 落实入井检身登记与人员识别卡管理，特种作业人员持证上岗，杜绝代打卡、冒名顶替
  outcome: 造成5人遇难，直接经济损失1982.28万元；事故发生后煤矿迟报、谎报（停产与恢复情况报告未提及）
  lessons:
  - 严禁违反过断层安全技术措施冒险掘进，支护滞后必须及时补强后再作业
  - 强化现场安全管理，关键危险作业须专职安全员监督并安排带班矿领导下井检查
  - 查清掘进面上覆采空区及老空巷道布置情况，完善施工技术管理与措施贯彻
  - 落实建设、施工、监理三方安全责任及上级企业安全管理责任，杜绝失察放任
  source: 国家矿山安全监察局事故调查和统计司（事故案例，无文号）
