- case_id: real-2022-003
  location: 山东新陶阳矿业有限责任公司（新陶阳煤矿）8305综采工作面撤面通道内（8煤层，中三井田-350m水平8300采区西翼，工作面标高-502.0～-446.3m）
  occurred_at: '2022-07-24T11:30:00'
  risk_level: yellow
  risk_level_original: 一般事故
  causes:
  - 8煤层直接顶四灰局部发育"二合顶"，受采动影响易冒落，冒落大块矸石（1m×0.6m×0.4m，重约700kg）砸人致死。
  - 新入职职工李全国在无人监护下独自回撤临时带帽单体液压支柱，未严格执行"敲帮问顶"制度，违章独立作业。
  - 撤面通道支护措施护顶能力差（钢梁间距1.5m、综采支架前护板到煤壁最大1.8m），不能有效防止大块矸石冒落，未针对"二合顶"制定专项措施。
  - 安全风险辨识管控不到位，未辨识出"二合顶"冒落风险；安全监督检查流于形式，师徒合同监护未落实。
  - 安全教育培训不到位，职工自保互保意识差；驻矿督查员对瞒报事故失察。
  precursors:
  - 8煤层直接顶四灰底部无规律分布透镜状、楔形、草帽形分层"二合顶"，受采动影响易冒落（事故区段顶板岩性固有弱面）
  - 回撤临时带帽单体液压支柱时顶板突发"哗啦"声响，随后矸石冒落（顶板失稳前兆）
  - 撤面通道施工区段钢梁间距1.5m、前护板距煤壁最大1.8m，护顶不充分（支护薄弱状态）
  actions:
  - 回撤临时支护、进入机道作业前必须严格执行"敲帮问顶"，先处理悬矸危岩，严禁空顶作业。
  - 对直接顶发育"二合顶"等易冒落构造的区段，优化支护设计并加密支护、提高护顶能力，防止大块矸石冒落。
  - 加强顶板离层监测，严把支护质量验收关，对撤面通道等特殊工序安排专人重点盯守。
  - 新工人入井作业严格落实师徒合同和监护职责，严禁单独作业、无人监护。
  outcome: 造成1人死亡，直接经济损失200.2万元；事故后矿井及上级公司瞒报事故，善后事宜于2022年7月29日处理完毕，矿井被罚款300万元、上级公司被罚款200万元。
  lessons:
  - 顶板局部"二合顶"构造受采动易冒落，撤面通道等特殊工序须针对顶板岩性制定专项支护措施并严格现场落实。
  - 严禁新工人独立作业，师徒合同监护、跟班安全检查必须落实到位。
  - 严格执行"敲帮问顶"和支护质量验收，严禁空顶作业，风险辨识要覆盖顶板构造特性。
  - 事故必须及时如实上报，瞒报事故的矿井及主要负责人将受到行政撤职、重罚等严厉问责。
  source: 新陶阳矿业有限责任公司"7·24"瞒报顶板事故调查组（国家矿山安全监察局山东局牵头组织，肥城市人民政府等参加，2022年10月9日）
