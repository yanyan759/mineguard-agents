- case_id: real-2023-002
  location: 河南省新郑煤电有限责任公司（郑煤集团直管矿井，位于河南省新郑市辛店镇境内）11采区11210工作面23#液压支架超前棚处（11210工作面位于11采区西翼中部）
  occurred_at: '2023-08-27T12:48:00'
  risk_level: yellow
  risk_level_original: 一般事故（报告按死亡1人认定，未出现等级字样）
  causes:
  - 直接原因：11210工作面受停采线附近SF4、F下19正断层及三面采空区影响应力集中、顶板破碎，作业人员违章站在22#、23#支架间采煤机电缆槽前处理顶板掉矸时，煤壁顶板发生片帮冒顶将其冲倒掩埋致死。
  - 现场违章作业：处理顶板掉矸前未按规定采取敲帮问顶、打设抬棚加固、撞楔法超前护顶等措施，未确认安全撤离路线、未及时清理煤矸杂物致退路不畅通。
  - 事故隐患未消除作业：8月26日4点班遗留的22#、23#支架超前棚未打设抬棚加固的事故隐患未汇报、未处理即组织作业，当班安全检查员未发现制止违章。
  - 安全风险辨识评估不准确：将11210工作面收尾期间过应力集中区可能出现片帮、冒顶的风险评估为低风险（应为重大风险），郑煤集团备案审核未发现与实际情况不符。
  - 安全教育培训不到位：未按规定组织对《11210工作面末采上网及扩超前棚安全技术措施》进行学习培训和考试，仅班前会进行部分内容学习。
  precursors:
  - 12时30分许，张占锋发现23#液压支架超前棚处顶板掉矸（现象性前兆，无量化数值）。
  - 8月26日4点班遗留隐患：22#、23#液压支架超前棚处未按措施打设抬棚加固（措施规定顶板压力显现时应沿倾向距煤墙300～500mm打设抬棚、一梁三柱）。
  - 12时48分前安设荆笆时顶板掉矸情况加剧，现场人员喊出"流渣了、撤"（顶板流渣、流煤危急征兆，措施规定该情况须立即撤离至架间行人通道）。
  - 地质前兆：受停采线附近SF4、F下19正断层和周边三面采空区影响应力集中，20#～23#液压支架段煤岩层起伏、顶板岩层破碎（无监测数值，为构造/采空影响描述）。
  actions:
  - 严格执行"敲帮问顶"制度、严禁空顶作业，遇顶板破碎、过地质构造带及应力集中区须制定专项安全技术措施并监督落实。
  - 顶板压力显现时沿倾向距煤墙300～500mm打设抬棚加固（一梁三柱并用防倒钢丝绳），遇片帮、流煤征兆采用撞楔法超前护顶，帮顶稳定确认安全后方可施工。
  - 作业前清理施工地点浮煤杂物、确认并确保退路畅通，落实重点岗位关键环节现场安全确认制度，做到不安全不作业。
  - 对排查出的事故隐患指定专人跟踪督促整改，在事故隐患消除前不得进行其他作业，实现隐患动态清零。
  outcome: 造成1人死亡（张卷超，重度颅脑损伤），直接经济损失134.88万元；8月30日与遇难矿工家属签订赔偿协议，8月31日遗体在新郑市殡仪馆火化，善后处理完毕，矿区社会秩序稳定。
  lessons:
  - 事故隐患必须及时消除后再作业，跟班队长、班组长对遗留隐患应登记并安排处理，严禁带隐患冒险施工。
  - 过应力集中区、地质构造带等环节应辨识为重大风险并制定针对性管控措施，上级公司对风险辨识评估结果备案须严格审核把关。
  - 作业规程和安全技术措施必须组织全员学习培训并考试合格后方准上岗作业，严防培训走过场。
  - 事故发生后应按规定时限（1小时内）如实上报，杜绝迟报、瞒报、谎报事故。
  source: 河南省新郑煤电公司"8·27"顶板事故调查组（国家矿山安全监察局河南局牵头，会同郑州市工业和信息化局、公安局、总工会等）· 2023年9月15日
