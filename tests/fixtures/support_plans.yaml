# ⚠️ HALLUCINATION: 以下支护方案/专家研判为开发者仿真构造，参考真实支护技术规范
#   （GB/T 35056-2018 巷道锚杆支护、GB 50213 井巷工程质量验收等）的结构编写，
#   内容为占位数据，不代表导师真实历年支护方案。
# 需要: 导师历年支护方案 + 专家研判记录 → RAGFlow 导入后替换本文件（格式不变，自动生效）。
# 第三数据域：导师历年支护方案 + 专家研判（独立知识源，不再从事故案例 actions 派生）。

support_plans:
  - scheme_id: "sp-001"
    scheme_name: "锚索+钢带加密支护方案"
    applicable_conditions:
      - "红警/高强度应力集中区域"
      - "顶板离层仪位移量超限"
      - "微震能量持续升高（>100000J）"
    actions:
      - "补打高强锚索（长度 ≥6m，间排距加密至 0.8m×0.8m）"
      - "铺设钢带并预紧至设计值"
      - "对巷道顶板进行拉拔力抽检"
    limitations:
      - "锚固深度不足 1.5m 时失效，需先探明岩层完整性"
      - "含水层区域需配合注浆封堵"
    source_type: "support_standard"
    source: "导师历年支护方案汇编（方案 03-14）"
    expert_review: "适用于顶板完整但应力集中的巷道；加密支护后 24h 内加密微震复测。"

  - scheme_id: "sp-002"
    scheme_name: "顶板注浆加固方案"
    applicable_conditions:
      - "含水层/破碎带揭露"
      - "岩层强度因含水而降低"
      - "砂岩含水层疏干风险"
    actions:
      - "对顶板破碎区钻孔注浆（水泥-水玻璃双液浆）"
      - "注浆孔间排距按 2m×2m，注浆压力分级控制"
      - "注浆完成 48h 后取芯验证固化效果"
    limitations:
      - "注浆区域覆盖不足是常见失败主因，需双倍覆盖探测范围"
      - "采动影响下浆液扩散半径不可控，需动态补注"
    source_type: "support_standard"
    source: "导师历年支护方案汇编（方案 09-27）"
    expert_review: "事后复盘确认注浆覆盖不足是上期事故主因，本期要求覆盖探测范围 2 倍。"

  - scheme_id: "sp-003"
    scheme_name: "卸压钻孔防治方案"
    applicable_conditions:
      - "断层活化/构造应力集中"
      - "微震事件沿构造呈条带分布"
      - "钻孔应力计读数异常升高"
    actions:
      - "在应力集中区域施工卸压钻孔（孔径 100-150mm）"
      - "钻孔深度穿过应力峰值区"
      - "施工后监测微震频次与能量衰减"
    limitations:
      - "卸压钻孔可能诱发小范围冲击，需分步施工并设警戒"
      - "断层附近卸压比加密支护更有效，但不能替代支护"
    source_type: "rock_burst"
    source: "导师历年支护方案汇编（方案 05-18）"
    expert_review: "卸压钻孔在断层活化情况下优先于加密支护；施工顺序自低应力区向高应力区推进。"

  - scheme_id: "sp-004"
    scheme_name: "单体液压支柱+木垛加强支护方案"
    applicable_conditions:
      - "采空区悬顶面积过大"
      - "周期来压期间"
      - "备用支护材料充分"
    actions:
      - "在工作面端头与巷道交叉口支设单体液压支柱"
      - "悬顶区域按 4m×4m 布置木垛"
      - "支柱初撑力达到额定值并二次补液"
    limitations:
      - "木垛料供应紧张时需提前调拨（当前库存为 shortage）"
      - "单体支柱密集区影响通行，需留设安全通道"
    source_type: "support_standard"
    source: "导师历年支护方案汇编（方案 11-09）"
    expert_review: "周期来压属常规现象，加强支护可低成本通过；重点监测支架阻力峰值是否稳定。"

  - scheme_id: "sp-005"
    scheme_name: "掘进面锚杆超前支护方案"
    applicable_conditions:
      - "巷道掘进揭露小断层"
      - "局部应力集中"
      - "微震事件集中于掘进面附近（<10m）"
    actions:
      - "暂停掘进，探测断层产状与延伸方向"
      - "补打锚杆（间排距加密，全长锚固）"
      - "探测确认无大范围失稳后恢复掘进"
    limitations:
      - "锚杆仅适用小断层/局部应力，大断层需注浆加固"
      - "探测结果决定是否升级为注浆方案"
    source_type: "support_standard"
    source: "导师历年支护方案汇编（方案 02-06）"
    expert_review: "小断层探测应列入掘进标准流程；局部微震集中是应力释放，不等于大范围失稳。"
